<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Email Verified - Glo-Tube</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e8f7ee;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin-bottom: 10px;
      color: #111827;
    }

    p {
      color: #667085;
      line-height: 1.6;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="icon">
      ✓
    </div>

    <h1>Email Verified!</h1>

    <p>
      Your Glo-Tube email address has been successfully verified.
    </p>

    <p>
      You can now continue using your Glo-Tube account.
    </p>

    <button onclick="location.href='home.html'">
      Continue to Glo-Tube
    </button>

  </div>

</body>
</html>
