<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Creator • Glo-Tube</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}
.topbar{height:62px;position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{font-size:21px;font-weight:800}.brand span{color:#1877f2}.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border:1px solid #e5e7eb;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:18px}
.creator-shell{max-width:980px;margin:auto;background:#fff;min-height:calc(100vh - 62px)}
.cover{height:250px;background:#dbe3ef;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#e5e7eb);color:#64748b;font-weight:800}
.head{padding:0 22px 20px;position:relative}.avatar-wrap{position:absolute;top:-66px;left:22px;width:132px;height:132px}
.avatar,.avatar-fallback{width:132px;height:132px;border-radius:50%;border:5px solid #fff;object-fit:cover;background:#1877f2}
.avatar-fallback{display:grid;place-items:center;color:#fff;font-size:42px;font-weight:800}
.head-content{padding-top:78px}.identity{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.name{margin:0;font-size:28px}.username{margin:6px 0;color:#6b7280;font-size:14px}.bio{line-height:1.55;color:#374151;max-width:700px}
.creator-actions{display:flex;gap:8px;align-items:center}.message-btn{border:1px solid #dbe3ef;border-radius:10px;padding:11px 16px;background:#fff;color:#1877f2;font-weight:800;min-width:105px}.follow{border:0;border-radius:10px;padding:11px 19px;background:#1877f2;color:#fff;font-weight:800;min-width:105px}
.following{background:#eef2f7;color:#111827}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin-top:20px}
.stat{border:0;background:#fff;padding:16px 7px;text-align:center;color:#111827}.stat strong{display:block;font-size:20px}.stat span{display:block;color:#6b7280;font-size:12px;margin-top:5px}
.stat-link{width:100%}.tabs{border-bottom:1px solid #e5e7eb}.tab{text-align:center;padding:15px;font-weight:800;color:#1877f2;border-bottom:3px solid #1877f2}
.videos{padding:18px 18px 95px}.section-title{margin:0 0 15px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.card{position:relative;aspect-ratio:9/14;background:#111;border-radius:5px;overflow:hidden}.card video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;left:0;right:0;bottom:0;padding:28px 8px 8px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.caption{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}.meta{font-size:11px;display:flex;gap:8px}
.empty{text-align:center;padding:55px 20px;color:#6b7280}.empty strong{display:block;color:#111827;font-size:18px;margin-bottom:7px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{margin:0}.close{border:0;width:36px;height:36px;border-radius:50%;background:#eef2f7}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.person-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#1877f2}.person-info{flex:1}.person-info strong{display:block}.person-info span{color:#6b7280;font-size:12px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:60;background:rgba(255,255,255,.97);border-top:1px solid #e5e7eb}.nav-inner{width:min(980px,100%);margin:auto;height:100%;display:grid;grid-template-columns:repeat(5,1fr)}.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6b7280;font-size:11px;font-weight:700}.nav-item b{font-size:20px}.nav-item.active{color:#1877f2}
@media(max-width:700px){.creator-actions{width:100%;margin-top:14px}.message-btn,.follow{flex:1}.cover{height:190px}.head{padding-left:15px;padding-right:15px}.avatar-wrap{left:15px;top:-55px;width:110px;height:110px}.avatar,.avatar-fallback{width:110px;height:110px}.head-content{padding-top:67px}.identity{display:block}.follow{margin-top:14px}.stats{grid-template-columns:repeat(4,1fr)}.stat strong{font-size:17px}.videos{padding-left:8px;padding-right:8px}.grid{gap:4px}}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="home1.html">Glo<span>-Tube</span></a>
  <div class="top-actions">
    <a class="icon-btn" href="search.html">⌕</a>
    <button class="icon-btn" id="menuBtn">⋮</button>
  </div>
</header>

<main class="creator-shell">
  <section class="cover">
    <div class="cover-fallback" id="coverFallback">Creator Cover</div>
    <img id="coverImage" alt="Creator cover" style="display:none">
  </section>

  <section class="head">
    <div class="avatar-wrap">
      <div class="avatar-fallback" id="avatarFallback">C</div>
      <img class="avatar" id="profileImage" alt="Creator profile picture" style="display:none">
    </div>

    <div class="head-content">
      <div class="identity">
        <div>
          <h1 class="name" id="creatorName">Creator</h1>
          <p class="username" id="creatorUsername">@creator</p>
        </div>
        <div class="creator-actions"><button class="message-btn" id="messageBtn" type="button">💬 Message</button><button class="follow" id="followBtn" type="button">Follow</button></div>
      </div>

      <p class="bio" id="creatorBio">Creator on Glo-Tube.</p>

      <div class="stats">
        <button class="stat stat-link" id="followersBtn"><strong id="followersCount">0</strong><span>Followers</span></button>
        <button class="stat stat-link" id="followingBtn"><strong id="followingCount">0</strong><span>Following</span></button>
        <div class="stat"><strong id="videoCount">0</strong><span>Videos</span></div>
        <div class="stat"><strong id="likeCount">0</strong><span>Total Likes</span></div>
      </div>
    </div>
  </section>

  <div class="tabs"><div class="tab">Videos</div></div>

  <section class="videos">
    <h2 class="section-title">Published videos</h2>
    <div class="grid" id="videoGrid"></div>
  </section>
</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a class="nav-item" href="home1.html"><b>⌂</b>Home</a>
    <a class="nav-item" href="discover.html"><b>◉</b>Discover</a>
    <a class="nav-item" href="upload.html"><b>＋</b>Upload</a>
    <a class="nav-item" href="notifications.html"><b>♡</b>Alerts</a>
    <a class="nav-item" href="profile.html"><b>◯</b>Profile</a>
  </div>
</nav>

<div class="modal" id="peopleModal">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="peopleTitle">Followers</h3>
      <button class="close" onclick="closeModal()">✕</button>
    </div>
    <div id="peopleList"></div>
  </div>
</div>

<script>
let currentUser=null;
let creator=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function num(n){n=Number(n||0);if(n>=1000000)return(n/1000000).toFixed(1)+"M";if(n>=1000)return(n/1000).toFixed(1)+"K";return n.toLocaleString();}
function closeModal(){$("peopleModal").classList.remove("show");}

async function init(){
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    currentUser=data?.session?.user||null;

    const params=new URLSearchParams(location.search);
    const username=params.get("user");
    const creatorId=params.get("id");

    if(username){
      const {data:p,error:e}=await supabaseClient.from("profiles").select("*").eq("username",username).maybeSingle();
      if(e)throw e;if(!p)throw new Error("Creator not found.");creator=p;
    }else if(creatorId){
      const {data:p,error:e}=await supabaseClient.from("profiles").select("*").eq("id",creatorId).maybeSingle();
      if(e)throw e;if(!p)throw new Error("Creator not found.");creator=p;
    }else{
      throw new Error("No creator was selected.");
    }

    // Prevent creator page from being used as the signed-in user's own profile.
    if(currentUser && currentUser.id===creator.id){
      location.replace("profile.html");
      return;
    }

    renderCreator();
    await Promise.all([loadStats(),loadVideos(),updateFollowButton()]);
    setupMessageButton();
  }catch(e){
    console.error(e);
    document.querySelector(".creator-shell").innerHTML=
      `<div class="empty" style="padding-top:100px"><strong>Creator unavailable</strong><p>${esc(e.message)}</p><a href="home1.html" style="color:#1877f2;font-weight:800">Back to Home</a></div>`;
  }
}

function renderCreator(){
  const full=[creator.first_name,creator.last_name].filter(Boolean).join(" ").trim();
  $("creatorName").textContent=full||creator.username||"Creator";
  $("creatorUsername").textContent="@"+(creator.username||"creator");
  $("creatorBio").textContent=creator.bio||"Creator on Glo-Tube.";

  const initial=(full||creator.username||"C").charAt(0).toUpperCase();
  $("avatarFallback").textContent=initial;

  if(creator.profile_photo){
    $("profileImage").src=creator.profile_photo;
    $("profileImage").style.display="block";
    $("avatarFallback").style.display="none";
  }
  if(creator.cover_photo){
    $("coverImage").src=creator.cover_photo;
    $("coverImage").style.display="block";
    $("coverFallback").style.display="none";
  }
}

async function loadStats(){
  const id=creator.id;

  const [followers,following,videos]=await Promise.all([
    supabaseClient.from("followers").select("*",{count:"exact",head:true}).eq("following_id",id),
    supabaseClient.from("followers").select("*",{count:"exact",head:true}).eq("follower_id",id),
    supabaseClient.from("videos").select("id").eq("user_id",id)
  ]);

  $("followersCount").textContent=num(followers.count||0);
  $("followingCount").textContent=num(following.count||0);
  $("videoCount").textContent=num(videos.data?.length||0);

  const ids=(videos.data||[]).map(v=>v.id);
  if(!ids.length){$("likeCount").textContent="0";return;}

  const {count,error}=await supabaseClient.from("likes").select("*",{count:"exact",head:true}).in("video_id",ids);
  $("likeCount").textContent=num(error?0:count||0);
}

async function loadVideos(){
  const {data,error}=await supabaseClient.from("videos")
    .select("id,video_url,thumbnail_url,caption,views,created_at")
    .eq("user_id",creator.id).order("created_at",{ascending:false});

  if(error){
    $("videoGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>Couldn't load videos</strong>${esc(error.message)}</div>`;
    return;
  }

  if(!data?.length){
    $("videoGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>No videos yet</strong>This creator hasn't published a video yet.</div>`;
    return;
  }

  $("videoGrid").innerHTML=data.map(v=>`
    <a class="card" href="watch.html?id=${encodeURIComponent(v.id)}">
      <video src="${esc(v.video_url)}" ${v.thumbnail_url?`poster="${esc(v.thumbnail_url)}"`:""} muted playsinline preload="metadata"></video>
      <div class="overlay">
        <div class="caption">${esc(v.caption||"Video")}</div>
        <div class="meta"><span>▶ ${num(v.views)}</span><span>Watch</span></div>
      </div>
    </a>`).join("");
}

function setupMessageButton(){
  const btn=$("messageBtn");
  if(!btn)return;
  btn.addEventListener("click",()=>{
    if(!currentUser){
      location.href="login.html";
      return;
    }
    if(currentUser.id===creator.id)return;
    location.href="chat.html?user="+encodeURIComponent(creator.id);
  });
}

async function updateFollowButton(){
  if(!currentUser){
    $("followBtn").textContent="Follow";
    return;
  }

  const {data,error}=await supabaseClient.from("followers")
    .select("id").eq("follower_id",currentUser.id).eq("following_id",creator.id).maybeSingle();

  if(error){console.error(error);return;}
  $("followBtn").textContent=data?"Unfollow":"Follow";
  $("followBtn").className=data?"follow following":"follow";
}

$("followBtn").addEventListener("click",async()=>{
  if(!currentUser){
    alert("Please log in to follow this creator.");
    location.href="login.html";
    return;
  }

  if(currentUser.id===creator.id)return;
  const btn=$("followBtn");btn.disabled=true;

  try{
    const {data:existing}=await supabaseClient.from("followers").select("id")
      .eq("follower_id",currentUser.id).eq("following_id",creator.id).maybeSingle();

    if(existing){
      const {error}=await supabaseClient.from("followers").delete().eq("id",existing.id);
      if(error)throw error;
    }else{
      const {error}=await supabaseClient.from("followers").insert({
        follower_id:currentUser.id,following_id:creator.id
      });
      if(error)throw error;
    }

    await Promise.all([updateFollowButton(),loadStats()]);
  }catch(e){alert(e.message||"Could not update follow status.");}
  finally{btn.disabled=false;}
});

async function showPeople(type){
  $("peopleTitle").textContent=type==="followers"?"Followers":"Following";
  $("peopleList").innerHTML="<p style='color:#6b7280'>Loading...</p>";
  $("peopleModal").classList.add("show");

  const source=type==="followers"?"following_id":"follower_id";
  const target=type==="followers"?"follower_id":"following_id";

  const {data:rows,error}=await supabaseClient.from("followers").select(target).eq(source,creator.id);
  if(error){$("peopleList").innerHTML=`<p>${esc(error.message)}</p>`;return;}

  const ids=(rows||[]).map(r=>r[target]);
  if(!ids.length){
    $("peopleList").innerHTML=`<div class="empty"><strong>No ${type} yet</strong></div>`;
    return;
  }

  const {data:people,error:e}=await supabaseClient.from("profiles")
    .select("id,username,first_name,last_name,profile_photo").in("id",ids);

  if(e){$("peopleList").innerHTML=`<p>${esc(e.message)}</p>`;return;}

  $("peopleList").innerHTML=(people||[]).map(p=>{
    const name=[p.first_name,p.last_name].filter(Boolean).join(" ")||p.username||"User";
    const avatar=p.profile_photo
      ?`<img class="person-avatar" src="${esc(p.profile_photo)}" alt="">`
      :`<div class="person-avatar" style="display:grid;place-items:center;color:#fff;font-weight:800">${esc(name.charAt(0).toUpperCase())}</div>`;
    return `<a class="person" href="creator.html?user=${encodeURIComponent(p.username)}">${avatar}<div class="person-info"><strong>${esc(name)}</strong><span>@${esc(p.username||"user")}</span></div></a>`;
  }).join("");
}

$("followersBtn").addEventListener("click",()=>showPeople("followers"));
$("followingBtn").addEventListener("click",()=>showPeople("following"));

$("menuBtn").addEventListener("click",async()=>{
  if(currentUser&&confirm("Log out of Glo-Tube?")){
    await supabaseClient.auth.signOut();
    location.href="index.html";
  }
});

$("peopleModal").addEventListener("click",e=>{if(e.target===$("peopleModal"))closeModal();});

init();
</script>
</body>
</html>
