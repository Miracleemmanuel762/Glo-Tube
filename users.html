<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users • Glo-Tube</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;padding:12px 16px}
.toprow{display:flex;align-items:center;gap:12px}
.back,.icon{width:40px;height:40px;border:0;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:20px;text-decoration:none;color:#111827}
.heading{flex:1}.heading h1{margin:0;font-size:21px}.heading p{margin:4px 0 0;color:#64748b;font-size:12px}
.search{margin-top:13px}.search input{width:100%;border:0;background:#f1f5f9;border-radius:14px;padding:13px 15px;outline:none}
.search input:focus{box-shadow:0 0 0 2px #2196f344}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 16px;border-bottom:1px solid #e5e7eb}
.filter{border:0;background:#f1f5f9;border-radius:20px;padding:9px 14px;white-space:nowrap;font-weight:700;color:#64748b;cursor:pointer}
.filter.active{background:#2196f3;color:#fff}
.list{padding:8px 0 85px}
.user{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;color:inherit;border-bottom:1px solid #f0f2f5}
.user:hover{background:#f8fafc}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#2196f3;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.info{min-width:0;flex:1}.name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{color:#64748b;font-size:12px;margin-top:3px}.bio{color:#64748b;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-size:24px;color:#94a3b8}
.state{text-align:center;padding:70px 25px;color:#64748b}.state strong{display:block;color:#111827;font-size:18px;margin-bottom:7px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:68px;background:rgba(255,255,255,.97);border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#64748b;text-decoration:none;font-size:10px;font-weight:700}
.nav a span{font-size:20px}.nav a.active{color:#2196f3}
.badge{display:none}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<div class="toprow">
<button class="back" type="button" onclick="history.back()">‹</button>
<div class="heading"><h1>Glo-Tube Users</h1><p>Discover creators and people on Glo-Tube</p></div>
<a class="icon" href="messages.html" aria-label="Messages">✉</a>
</div>
<div class="search"><input id="search" type="search" placeholder="Search users..."></div>
</header>

<div class="filters">
<button class="filter active" data-filter="all">All Users</button>
<button class="filter" data-filter="creators">Creators</button>
</div>

<section id="list" class="list"><div class="state">Loading users...</div></section>
</main>

<nav class="nav">
<a href="home.html"><span>⌂</span>Home</a>
<a class="active" href="users.html"><span>◉</span>Users</a>
<a href="upload.html"><span>＋</span>Upload</a>
<a href="notifications.html"><span>♡</span>Alerts</a>
<a href="profile.html"><span>◯</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let users=[];
let filter="all";
const $=id=>document.getElementById(id);

async function boot(){
 const {data,error}=await supabaseClient.auth.getSession();
 if(error||!data.session){location.replace("login.html");return}
 await loadUsers();
}

async function loadUsers(){
 const list=$("list");
 try{
  const {data,error}=await supabaseClient
   .from("profiles")
   .select("id,username,first_name,last_name,bio,profile_photo")
   .order("created_at",{ascending:false})
   .limit(100);
  if(error)throw error;
  users=data||[];
  render();
 }catch(e){
  console.error(e);
  list.innerHTML='<div class="state"><strong>Unable to load users</strong>'+escapeHTML(e.message)+'</div>';
 }
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 let rows=users.filter(u=>{
  if(filter==="creators")return true;
  return true;
 }).filter(u=>{
  const text=[u.username,u.first_name,u.last_name,u.bio].join(" ").toLowerCase();
  return text.includes(q);
 });

 if(!rows.length){
  $("list").innerHTML='<div class="state"><strong>No users found</strong>Try another name or username.</div>';
  return;
 }

 $("list").innerHTML=rows.map(u=>{
  const name=([u.first_name,u.last_name].filter(Boolean).join(" ").trim())||u.username||"Glo-Tube User";
  const initial=name.charAt(0).toUpperCase();
  const avatar=u.profile_photo
   ? `<img class="avatar" src="${escapeAttr(u.profile_photo)}" alt="">`
   : `<div class="avatar">${escapeHTML(initial)}</div>`;
  return `<a class="user" href="creator.html?id=${encodeURIComponent(u.id)}">
   ${avatar}
   <div class="info">
    <div class="name">${escapeHTML(name)}</div>
    <div class="handle">@${escapeHTML(u.username||"user")}</div>
    ${u.bio?`<div class="bio">${escapeHTML(u.bio)}</div>`:""}
   </div>
   <div class="arrow">›</div>
  </a>`;
 }).join("");
}

$("search").addEventListener("input",render);
document.querySelectorAll(".filter").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  filter=btn.dataset.filter;
  render();
 });
});

function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function escapeAttr(v){return escapeHTML(v)}
boot();
</script>
</body>
</html>
