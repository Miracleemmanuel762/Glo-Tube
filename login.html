<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Glo-Tube</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      color: #e60000;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #e60000;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e60000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #666;
    }

    .register a {
      color: #e60000;
      font-weight: bold;
      text-decoration: none;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
      color: #e60000;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Glo-Tube
    </div>

    <p class="subtitle">
      Welcome back. Login to continue.
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <a href="#" class="forgot">
        Forgot password?
      </a>

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create one</a>
    </div>

  </div>


  <script src="supabase.js"></script>

  <script>

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      message.textContent = "";


      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


      if (error) {

        message.textContent = error.message;

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }


      message.textContent =
        "Login successful. Redirecting...";


      window.location.replace("login-success.html");

    });

  </script>

</body>

  </html>
