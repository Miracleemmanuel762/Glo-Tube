<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Profile • Glo-Tube</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#111827;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.top{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:800}.brand i{color:#1877f2;font-style:normal}.ico{width:40px;height:40px;border:1px solid #e5e7eb;background:#fff;border-radius:50%}.page{max-width:980px;margin:auto;background:#fff;min-height:calc(100vh - 62px)}.cover{height:260px;background:#dbe4f0;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover .fallback{height:100%;display:grid;place-items:center;color:#64748b;font-weight:700}.editcover{position:absolute;right:14px;top:14px;background:#111827dd;color:#fff;border:0;border-radius:10px;padding:9px 12px}.head{padding:0 22px 18px;position:relative}.avatar{position:absolute;top:-68px;left:22px;width:136px;height:136px;border:5px solid #fff;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-size:44px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar button{position:absolute;right:0;bottom:0;border:3px solid #fff;background:#111827;color:#fff;border-radius:50%;width:38px;height:38px}.info{padding-top:82px}.row{display:flex;justify-content:space-between;gap:15px}.name{font-size:28px;margin:0}.user{color:#6b7280;margin:6px 0}.bio{color:#374151;line-height:1.5;max-width:700px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:800}.blue{background:#1877f2;color:#fff}.gray{background:#eef2f7}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid #e5e7eb;margin-top:20px}.stat{border:0;background:#fff;padding:15px 5px;text-align:center}.stat strong{display:block;font-size:20px}.stat span{font-size:12px;color:#6b7280}.tabs{padding:15px 20px;border-bottom:1px solid #e5e7eb;font-weight:800;color:#1877f2}.videos{padding:16px 10px 90px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.card{position:relative;aspect-ratio:9/14;background:#111;overflow:hidden}.card video{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;bottom:0;left:0;right:0;color:#fff;padding:28px 8px 8px;background:linear-gradient(transparent,#000c);font-size:12px}.empty{text-align:center;padding:55px 20px;color:#6b7280}.empty b{display:block;color:#111827;font-size:18px;margin-bottom:7px}.nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fffffff5;border-top:1px solid #e5e7eb;z-index:30}.navin{max-width:980px;height:100%;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748b;gap:3px}.nav a b{font-size:20px}.nav a.active{color:#1877f2}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.sheethead{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:36px;height:36px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:800}.form input,.form textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px}.form textarea{min-height:90px}.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.person img,.pa{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#1877f2;color:#fff;display:grid;place-items:center;font-weight:800}.person div:last-child{flex:1}.muted{color:#6b7280;font-size:12px}@media(max-width:650px){.cover{height:190px}.head{padding:0 15px 18px}.avatar{left:15px;width:112px;height:112px;top:-56px}.info{padding-top:68px}.row{display:block}.actions{margin-top:12px}.stats strong{font-size:17px}.videos{padding-inline:5px}.grid{gap:3px}}
</style></head><body>
<header class="top"><a class="brand" href="home1.html">Glo<i>-Tube</i></a><a class="ico" href="search.html" style="display:grid;place-items:center">⌕</a></header>
<main class="page"><section class="cover" id="cover"><div class="fallback" id="coverFallback">Cover Photo</div><img id="coverImg" style="display:none"><button class="editcover" id="editCover" style="display:none">✎ Edit cover</button></section><section class="head"><div class="avatar" id="avatar"><span id="initial">G</span><img id="avatarImg" style="display:none"><button id="editAvatar" style="display:none">✎</button></div><div class="info"><div class="row"><div><h1 class="name" id="name">Glo-Tube User</h1><div class="user" id="username">@user</div></div><div class="actions"><button class="btn blue" id="follow" style="display:none">Follow</button><button class="btn gray" id="edit" style="display:none">Edit profile</button></div></div><p class="bio" id="bio">Welcome to Glo-Tube.</p><div class="stats"><button class="stat" id="followers"><strong id="followersN">0</strong><span>Followers</span></button><button class="stat" id="following"><strong id="followingN">0</strong><span>Following</span></button><div class="stat"><strong id="videosN">0</strong><span>Videos</span></div><div class="stat"><strong id="likesN">0</strong><span>Total Likes</span></div></div></div></section><div class="tabs">Published videos</div><section class="videos"><div class="grid" id="grid"></div></section></main>
<nav class="nav"><div class="navin"><a href="home.html"><b>⌂</b>Home</a><a href="discover.html"><b>◉</b>Discover</a><a href="upload.html"><b>＋</b>Upload</a><a href="notifications.html"><b>♡</b>Alerts</a><a class="active" href="profile.html"><b>◯</b>Profile</a></div></nav>
<div class="modal" id="peopleModal"><div class="sheet"><div class="sheethead"><h3 id="peopleTitle">Followers</h3><button class="close" onclick="closeM('peopleModal')">✕</button></div><div id="peopleList"></div></div></div>
<div class="modal" id="editModal"><div class="sheet"><div class="sheethead"><h3>Edit profile</h3><button class="close" onclick="closeM('editModal')">✕</button></div><form class="form" id="editForm"><label>First name<input id="first"></label><label>Last name<input id="last"></label><label>Username<input id="uname" required></label><label>Bio<textarea id="bioInput" maxlength="180"></textarea></label><label>Profile picture<input id="pfile" type="file" accept="image/*"></label><label>Cover picture<input id="cfile" type="file" accept="image/*"></label><div class="muted" id="status"></div><button class="btn blue" type="submit">Save profile</button></form></div></div>
<script>
const CLOUD="dg9qaek0h",PRESET="glotube_uploads";let me=null,profile=null;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toLocaleString()};function closeM(id){$(id).classList.remove('show')}
async function imageUpload(file){if(!file)return '';let f=new FormData();f.append('file',file);f.append('upload_preset',PRESET);let r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:f});let d=await r.json();if(!r.ok||!d.secure_url)throw Error(d.error?.message||'Image upload failed.');return d.secure_url}
async function session(){let r=await supabaseClient.auth.getSession();me=r.data?.session?.user||null}
async function ownProfile(){let u=me;if(!u)return;let username=u.user_metadata?.username||u.email?.split('@')[0]||'user';await supabaseClient.from('profiles').upsert({id:u.id,username},{onConflict:'id',ignoreDuplicates:true});}
async function resolve(){let q=new URLSearchParams(location.search).get('user');if(q){let r=await supabaseClient.from('profiles').select('*').eq('username',q).maybeSingle();if(r.data){profile=r.data;return}}if(!me){location.href='login.html';return}await ownProfile();let r=await supabaseClient.from('profiles').select('*').eq('id',me.id).single();if(r.error)throw r.error;profile=r.data}
async function load(){let full=[profile.first_name,profile.last_name].filter(Boolean).join(' ')||profile.username||'User';$('name').textContent=full;$('username').textContent='@'+(profile.username||'user');$('bio').textContent=profile.bio||'Welcome to Glo-Tube.';$('initial').textContent=full[0].toUpperCase();if(profile.profile_photo){$('avatarImg').src=profile.profile_photo;$('avatarImg').style.display='block';$('initial').style.display='none'}if(profile.cover_photo){$('coverImg').src=profile.cover_photo;$('coverImg').style.display='block';$('coverFallback').style.display='none'}let own=me&&me.id===profile.id;$('edit').style.display=own?'inline-block':'none';$('editAvatar').style.display=own?'grid':'none';$('editCover').style.display=own?'block':'none';if(!own){$('follow').style.display='inline-block';await followState()}await stats();await videos()}
async function stats(){let id=profile.id;let [a,b,v]=await Promise.all([supabaseClient.from('followers').select('*',{count:'exact',head:true}).eq('following_id',id),supabaseClient.from('followers').select('*',{count:'exact',head:true}).eq('follower_id',id),supabaseClient.from('videos').select('id').eq('user_id',id)]);$('followersN').textContent=fmt(a.count);$('followingN').textContent=fmt(b.count);$('videosN').textContent=fmt(v.data?.length);let ids=(v.data||[]).map(x=>x.id);let l=ids.length?await supabaseClient.from('likes').select('*',{count:'exact',head:true}).in('video_id',ids):{count:0};$('likesN').textContent=fmt(l.count)}
async function videos(){let r=await supabaseClient.from('videos').select('id,video_url,thumbnail_url,caption,views').eq('user_id',profile.id).order('created_at',{ascending:false});if(r.error)throw r.error;let d=r.data||[];if(!d.length){$('grid').innerHTML=`<div class="empty" style="grid-column:1/-1"><b>No videos yet</b>${me&&me.id===profile.id?'Upload your first video.':'This creator has not published a video yet.'}</div>`;return}$('grid').innerHTML=d.map(v=>`<a class="card" href="watch.html?id=${encodeURIComponent(v.id)}"><video src="${esc(v.video_url)}" ${v.thumbnail_url?`poster="${esc(v.thumbnail_url)}"`:''} muted playsinline preload="metadata"></video><div class="overlay">${esc(v.caption||'Video')}<br>▶ ${fmt(v.views)}</div></a>`).join('')}
async function followState(){let r=await supabaseClient.from('followers').select('id').eq('follower_id',me.id).eq('following_id',profile.id).maybeSingle();$('follow').textContent=r.data?'Following':'Follow';$('follow').className='btn '+(r.data?'gray':'blue')}
$('follow').onclick=async()=>{if(!me){location.href='login.html';return}let r=await supabaseClient.from('followers').select('id').eq('follower_id',me.id).eq('following_id',profile.id).maybeSingle();if(r.data)await supabaseClient.from('followers').delete().eq('id',r.data.id);else await supabaseClient.from('followers').insert({follower_id:me.id,following_id:profile.id});await followState();await stats()}
async function people(type){$('peopleTitle').textContent=type==='followers'?'Followers':'Following';$('peopleList').innerHTML='<p>Loading...</p>';$('peopleModal').classList.add('show');let col=type==='followers'?'following_id':'follower_id',target=type==='followers'?'follower_id':'following_id';let r=await supabaseClient.from('followers').select(target).eq(col,profile.id);let ids=(r.data||[]).map(x=>x[target]);if(!ids.length){$('peopleList').innerHTML='<div class="empty">No one here yet.</div>';return}let p=await supabaseClient.from('profiles').select('username,first_name,last_name,profile_photo').in('id',ids);$('peopleList').innerHTML=(p.data||[]).map(x=>{let n=[x.first_name,x.last_name].filter(Boolean).join(' ')||x.username;return `<a class="person" href="profile.html?user=${encodeURIComponent(x.username)}">${x.profile_photo?`<img src="${esc(x.profile_photo)}">`:`<div class="pa">${esc(n[0])}</div>`}<div><b>${esc(n)}</b><br><span class="muted">@${esc(x.username)}</span></div></a>`}).join('')}
$('followers').onclick=()=>people('followers');$('following').onclick=()=>people('following');function openEdit(){$('first').value=profile.first_name||'';$('last').value=profile.last_name||'';$('uname').value=profile.username||'';$('bioInput').value=profile.bio||'';$('editModal').classList.add('show')}$('edit').onclick=openEdit;$('editAvatar').onclick=openEdit;$('editCover').onclick=openEdit;
$('editForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;$('status').textContent='Saving...';try{let pp=profile.profile_photo||'',cp=profile.cover_photo||'';if($('pfile').files[0])pp=await imageUpload($('pfile').files[0]);if($('cfile').files[0])cp=await imageUpload($('cfile').files[0]);let r=await supabaseClient.from('profiles').upsert({id:me.id,first_name:$('first').value.trim(),last_name:$('last').value.trim(),username:$('uname').value.trim().replace(/\s/g,''),bio:$('bioInput').value.trim(),profile_photo:pp,cover_photo:cp},{onConflict:'id'}).select().single();if(r.error)throw r.error;profile=r.data;$('editModal').classList.remove('show');await load()}catch(x){$('status').textContent=x.message}finally{b.disabled=false}}
(async()=>{try{await session();await resolve();await load()}catch(e){document.querySelector('.page').innerHTML=`<div class="empty"><b>Profile unavailable</b>${esc(e.message)}</div>`}})();
</script></body></html>
