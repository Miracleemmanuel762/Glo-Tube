<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Glo-Tube — Create Video</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}button,input,textarea{font:inherit}.page{max-width:720px;margin:auto;padding:18px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:23px;font-weight:800}.brand span{color:#3b9cff}.back{color:#fff;text-decoration:none;background:#171717;border:1px solid #2a2a2a;border-radius:12px;padding:9px 12px}.picker{border:1px dashed #555;border-radius:18px;padding:28px;text-align:center;background:#111}.picker input{width:100%;margin-top:14px}.preview-wrap{display:none;margin-top:16px;background:#000;border-radius:18px;overflow:hidden;position:relative}.preview-wrap video{display:block;width:100%;max-height:62vh;object-fit:contain;background:#000}.tools{display:none;margin-top:16px;background:#111;border:1px solid #242424;border-radius:18px;padding:15px}.tool-title{font-weight:800;margin:0 0 10px}.row{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tool{flex:0 0 auto;border:1px solid #333;background:#181818;color:#fff;border-radius:12px;padding:10px 13px}.tool.active{border-color:#3b9cff;background:#10243a}.field{margin-top:15px}.field label{display:block;font-size:13px;color:#aaa;margin-bottom:7px}.range{width:100%}textarea{width:100%;min-height:90px;background:#171717;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;resize:vertical}.actions{display:none;margin-top:16px;gap:10px}.primary,.secondary{border:0;border-radius:13px;padding:13px 16px;font-weight:800}.primary{background:#3b9cff;color:#fff;flex:1}.secondary{background:#222;color:#fff}.status{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#121212;color:#bbb;font-size:14px;line-height:1.45}.music-name{font-size:12px;color:#aaa;margin-top:7px}.hidden{display:none!important}@media(min-width:600px){.preview-wrap video{max-height:68vh}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div class="brand">Glo-<span>Tube</span></div><a class="back" href="home.html">Cancel</a></header>
<section class="picker" id="picker"><h2>Choose a video</h2><p style="color:#aaa">Select a video from your phone, then edit it before posting.</p><input id="videoFile" type="file" accept="video/*"></section>
<section class="preview-wrap" id="previewWrap"><video id="preview" playsinline controls></video></section>
<section class="tools" id="tools">
<h3 class="tool-title">Effects</h3>
<div class="row" id="filters">
<button class="tool active" data-filter="none">Normal</button><button class="tool" data-filter="brightness">Bright</button><button class="tool" data-filter="contrast">Contrast</button><button class="tool" data-filter="saturate">Vivid</button><button class="tool" data-filter="grayscale">B&W</button><button class="tool" data-filter="sepia">Warm</button>
</div>
<div class="field"><label>Speed</label><div class="row" id="speeds"><button class="tool active" data-speed="1">1×</button><button class="tool" data-speed="0.5">0.5×</button><button class="tool" data-speed="1.5">1.5×</button><button class="tool" data-speed="2">2×</button></div></div>
<div class="field"><label>Original sound</label><input class="range" id="videoVolume" type="range" min="0" max="1" step="0.05" value="1"></div>
<div class="field"><label>Background sound</label><input id="audioFile" type="file" accept="audio/*"><div class="music-name" id="musicName">No background sound selected.</div></div>
<div class="field"><label>Background sound volume</label><input class="range" id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.6"></div>
<div class="field"><label>Caption</label><textarea id="caption" maxlength="1000" placeholder="Write a caption..."></textarea></div>
</section>
<div class="actions" id="actions"><button class="secondary" id="reset" type="button">Reset</button><button class="primary" id="post" type="button">Render &amp; Post</button></div>
<div class="status" id="status"></div>
</main>
<script>
const CLOUDINARY_CLOUD="dg9qaek0h", CLOUDINARY_PRESET="glotube_uploads";
const $=id=>document.getElementById(id);
let currentUser=null, videoURL="", audioURL="", filterName="none", speed=1, audioFile=null, selectedVideoFile=null;
const filterMap={none:"none",brightness:"brightness(1.25)",contrast:"contrast(1.3)",saturate:"saturate(1.7)",grayscale:"grayscale(1)",sepia:"sepia(.75)"};
function status(text,show=true){$("status").style.display=show?"block":"none";$("status").textContent=text}
async function boot(){const {data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(!currentUser){location.replace("login.html");return}}
boot();
$("videoFile").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;selectedVideoFile=file;videoURL=URL.createObjectURL(file);$("preview").src=videoURL;$("previewWrap").style.display="block";$("tools").style.display="block";$("actions").style.display="flex";$("preview").load()});
$("filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;document.querySelectorAll("#filters .tool").forEach(x=>x.classList.remove("active"));b.classList.add("active");filterName=b.dataset.filter;$("preview").style.filter=filterMap[filterName]||"none"});
$("speeds").addEventListener("click",e=>{const b=e.target.closest("button[data-speed]");if(!b)return;document.querySelectorAll("#speeds .tool").forEach(x=>x.classList.remove("active"));b.classList.add("active");speed=Number(b.dataset.speed);$("preview").playbackRate=speed});
$("videoVolume").addEventListener("input",e=>$("preview").volume=Number(e.target.value));
$("audioFile").addEventListener("change",e=>{audioFile=e.target.files[0]||null;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=audioFile?URL.createObjectURL(audioFile):"";$("musicName").textContent=audioFile?audioFile.name:"No background sound selected."});
$("reset").onclick=()=>{filterName="none";speed=1;$("preview").style.filter="none";$("preview").playbackRate=1;$("preview").volume=1;$("videoVolume").value=1;$("musicVolume").value=.6;document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));document.querySelector('#filters [data-filter="none"]').classList.add("active");document.querySelector('#speeds [data-speed="1"]').classList.add("active")};
function getUsername(){return currentUser.user_metadata?.username||currentUser.email?.split("@")[0]||"User"}
async function cloudinaryUpload(blob,resource="video",filename="glotube-video"){const fd=new FormData();fd.append("file",blob,filename);fd.append("upload_preset",CLOUDINARY_PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resource}/upload`,{method:"POST",body:fd});const j=await r.json();if(!r.ok||!j.secure_url)throw new Error(j.error?.message||"Cloudinary upload failed");return j.secure_url}
async function renderEdited(){const v=$("preview");if(!v.src)throw new Error("Please choose a video first.");
const canvas=document.createElement("canvas");const w=v.videoWidth||720,h=v.videoHeight||1280;const max=1280;const scale=Math.min(1,max/Math.max(w,h));canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);const ctx=canvas.getContext("2d");
const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error("This browser cannot render edited audio. Upload without edits or use a newer browser.");const ac=new AudioContextClass();await ac.resume();const dest=ac.createMediaStreamDestination();const videoSource=ac.createMediaElementSource(v);const videoGain=ac.createGain();videoGain.gain.value=Number($("videoVolume").value);videoSource.connect(videoGain);videoGain.connect(dest);videoGain.connect(ac.destination);
let musicAudio=null,musicSource=null,musicGain=null;if(audioURL){musicAudio=new Audio(audioURL);musicAudio.loop=false;musicAudio.volume=1;musicSource=ac.createMediaElementSource(musicAudio);musicGain=ac.createGain();musicGain.gain.value=Number($("musicVolume").value);musicSource.connect(musicGain);musicGain.connect(dest);musicGain.connect(ac.destination)}
const stream=canvas.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime="video/webm;codecs=vp9,opus";if(!MediaRecorder.isTypeSupported(mime))mime="video/webm";const recorder=new MediaRecorder(stream,{mimeType:mime});const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
return await new Promise((resolve,reject)=>{let stopped=false;const finish=()=>{if(stopped)return;stopped=true;try{recorder.stop()}catch{};v.pause();if(musicAudio)musicAudio.pause();ac.close().catch(()=>{});};recorder.onstop=()=>resolve(new Blob(chunks,{type:mime}));recorder.onerror=e=>reject(e.error||new Error("Video rendering failed."));
const draw=()=>{if(stopped)return;ctx.save();ctx.filter=filterMap[filterName]||"none";ctx.drawImage(v,0,0,canvas.width,canvas.height);ctx.restore();requestAnimationFrame(draw)};draw();
const onEnd=()=>finish();v.currentTime=0;v.playbackRate=speed;v.addEventListener("ended",onEnd,{once:true});recorder.start(250);v.play().then(()=>{if(musicAudio)musicAudio.play().catch(()=>{});}).catch(reject);setTimeout(()=>{if(!stopped&&v.duration&&isFinite(v.duration)){finish()}},Math.max(1000,(v.duration/speed)*1000+1500));});}
$("post").onclick=async()=>{
  if(!currentUser){location.replace("login.html");return}
  if(!selectedVideoFile){status("Please choose a video first.");return}
  const post=$("post");post.disabled=true;
  try{
    const needsRendering = filterName!=="none" || speed!==1 || !!audioFile || Number($("videoVolume").value)!==1;
    let uploadBlob=selectedVideoFile;
    let filename=selectedVideoFile.name || "glotube-video.mp4";
    if(needsRendering){
      post.textContent="Rendering…";
      status("Applying your edits. Keep this page open until it finishes…");
      uploadBlob=await renderEdited();
      filename="glotube-edited.webm";
    } else {
      // Upload the original file directly when no edits are requested. This avoids
      // browser MediaRecorder re-encoding, which can cause mobile audio/frame issues.
      status("Preparing your original video for upload…");
    }
    status("Uploading video to Cloudinary…");post.textContent="Uploading…";
    const url=await cloudinaryUpload(uploadBlob,"video",filename);
    const {error}=await supabaseClient.from("videos").insert({user_id:currentUser.id,username:getUsername(),video_url:url,caption:$("caption").value.trim(),views:0});
    if(error)throw error;
    status("Posted successfully. Opening Glo-Tube…");
    setTimeout(()=>location.replace("home.html"),700);
  }catch(err){
    console.error(err);status("Could not post: "+(err.message||err));post.disabled=false;post.textContent="Render & Post";
  }
};
</script>
</body>
</html>
