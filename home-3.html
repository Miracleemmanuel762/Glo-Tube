<script>

let currentUser = null;
let videos = [];
let activeVideoId = null;
let observer = null;
let viewedVideos = new Set();

let audioContext = null;

function getAudioContext() {
  if (!audioContext) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return null;
    audioContext = new AudioContext();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume().catch(() => {});
  }

  return audioContext;
}

function playLikeSound() {
  const ctx = getAudioContext();
  if (!ctx) return;

  const now = ctx.currentTime;
  const gain = ctx.createGain();
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();

  osc1.type = "sine";
  osc2.type = "triangle";
  osc1.frequency.setValueAtTime(650, now);
  osc1.frequency.exponentialRampToValueAtTime(1000, now + 0.08);
  osc2.frequency.setValueAtTime(330, now);
  osc2.frequency.exponentialRampToValueAtTime(550, now + 0.08);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(1.35, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);

  osc1.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);
  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + 0.3);
  osc2.stop(now + 0.3);
}

function playCommentSuccessSound() {
  const ctx = getAudioContext();
  if (!ctx) return;

  const now = ctx.currentTime;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(1.05, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
  gain.connect(ctx.destination);

  [660, 880, 1100].forEach((frequency, index) => {
    const oscillator = ctx.createOscillator();
    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    oscillator.connect(gain);
    oscillator.start(now + index * 0.06);
    oscillator.stop(now + 0.16 + index * 0.06);
  });
}



/* =========================
   CHECK USER
========================= */

async function loadCurrentUser() {
  try {
    const { data } = await supabaseClient.auth.getSession();
    currentUser = data?.session?.user || null;
  } catch (error) {
    console.log("Auth session unavailable:", error);
    currentUser = null;
  }
}
/* =========================
   NOTIFICATION / MESSAGE COUNTS
========================= */

async function loadNotificationCount() {
  if (!currentUser) return;

  try {
    const { count, error } = await supabaseClient
      .from("notifications")
      .select("id", { count: "exact", head: true })
      .eq("user_id", currentUser.id)
      .eq("is_read", false);

    if (error) throw error;

    const value = count || 0;

    [
      document.getElementById("notificationCount"),
      document.getElementById("topNotificationCount")
    ].forEach(function(badge) {
      if (!badge) return;

      if (value > 0) {
        badge.textContent = value > 99 ? "99+" : value;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    });
  } catch (error) {
    console.error("Notification count error:", error);
  }
}

async function loadMessageCount() {
  if (!currentUser) return;

  try {
    const { count, error } = await supabaseClient
      .from("messages")
      .select("id", { count: "exact", head: true })
      .eq("receiver_id", currentUser.id)
      .eq("is_read", false);

    if (error) throw error;

    const badge = document.getElementById("messageCount");
    if (!badge) return;

    if ((count || 0) > 0) {
      badge.textContent = count > 99 ? "99+" : count;
      badge.style.display = "flex";
    } else {
      badge.style.display = "none";
    }
  } catch (error) {
    console.error("Message count error:", error);
  }
}

function loadHeaderCounts() {
  loadNotificationCount();
  loadMessageCount();
}



/* =========================
   FOLLOW SYSTEM
========================= */

async function updateFollowButton(button, creatorId) {
  if (!button || !creatorId) return;

  button.disabled = true;
  button.classList.remove("following");

  if (!currentUser) {
    button.textContent = "Follow";
    button.disabled = false;
    return;
  }

  if (currentUser.id === creatorId) {
    button.textContent = "You";
    button.disabled = true;
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from("followers")
      .select("id")
      .eq("follower_id", currentUser.id)
      .eq("following_id", creatorId)
      .limit(1);

    if (error) throw error;

    const following = Array.isArray(data) && data.length > 0;
    button.dataset.following = following ? "true" : "false";
    button.textContent = following ? "Following" : "Follow";
    button.classList.toggle("following", following);
  } catch (error) {
    console.error("Follow status error:", error);
    button.dataset.following = "false";
    button.textContent = "Follow";
  } finally {
    button.disabled = false;
  }
}

async function ensureCurrentProfile() {
  if (!currentUser) return;

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) throw error;
  if (data) return;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const { error: insertError } = await supabaseClient
    .from("profiles")
    .insert({
      id: currentUser.id,
      username: username
    });

  if (insertError && insertError.code !== "23505") {
    throw insertError;
  }
}

async function toggleFollow(creatorId, button) {
  if (!currentUser) {
    alert("Please log in to follow creators.");
    return;
  }

  if (!creatorId || currentUser.id === creatorId) return;
  if (button.dataset.busy === "true") return;

  button.dataset.busy = "true";
  button.disabled = true;

  try {
    await ensureCurrentProfile();

    const { data, error: checkError } = await supabaseClient
      .from("followers")
      .select("id")
      .eq("follower_id", currentUser.id)
      .eq("following_id", creatorId)
      .limit(1);

    if (checkError) throw checkError;

    if (data && data.length) {
      const { error } = await supabaseClient
        .from("followers")
        .delete()
        .eq("follower_id", currentUser.id)
        .eq("following_id", creatorId);

      if (error) throw error;
    } else {
      const { error } = await supabaseClient
        .from("followers")
        .insert({
          follower_id: currentUser.id,
          following_id: creatorId
        });

      if (error) throw error;
    }

    await updateFollowButton(button, creatorId);
  } catch (error) {
    console.error("Follow action error:", error);
    alert("Unable to update follow status.\n\n" + error.message);
  } finally {
    button.dataset.busy = "false";
    button.disabled = false;
  }
}

function getPlayableVideoUrl(url) {
  if (!url) return "";
  try {
    const parsed = new URL(url, window.location.href);
    if (parsed.hostname.endsWith("cloudinary.com") && parsed.pathname.includes("/video/upload/")) {
      // Force a broadly compatible MP4/H.264/AAC delivery format for Android.
      // Apply it only once; do not accidentally stack transformations.
      const marker = "/video/upload/";
      const before = parsed.pathname.split(marker)[0] + marker;
      const after = parsed.pathname.split(marker).slice(1).join(marker);
      if (!/^(?:f_mp4|vc_h264|ac_aac)(?:,|\/)/.test(after)) {
        parsed.pathname = before + "f_mp4,vc_h264,ac_aac/" + after;
      }
    }
    return parsed.toString();
  } catch (error) {
    console.warn("Video URL transformation skipped:", error);
    return url;
  }
}

/* =========================
   VIDEO OBSERVER
========================= */

function setupVideoObserver() {
  const feed = document.getElementById("feed");
  const items = Array.from(document.querySelectorAll(".video-item"));
  if (observer) observer.disconnect();

  let desiredItem = null;
  let activationToken = 0;

  async function activateVideo(item) {
    if (!item) return;
    desiredItem = item;
    const token = ++activationToken;
    const video = item.querySelector(".video-player");
    if (!video) return;

    activeVideoId = item.dataset.videoId;
    document.querySelectorAll(".video-player").forEach(function(other) {
      if (other !== video) other.pause();
    });

    try {
      if (video.readyState === 0) video.load();
      if (video.readyState < 2) {
        await new Promise(function(resolve) {
          let done = false;
          const finish = function() {
            if (done) return;
            done = true;
            video.removeEventListener("loadeddata", finish);
            video.removeEventListener("canplay", finish);
            video.removeEventListener("error", finish);
            resolve();
          };
          video.addEventListener("loadeddata", finish, { once: true });
          video.addEventListener("canplay", finish, { once: true });
          video.addEventListener("error", finish, { once: true });
          setTimeout(finish, 7000);
        });
      }
      // If the user has already swiped to another clip, do not start this one.
      if (token !== activationToken || desiredItem !== item || !item.isConnected) return;
      await video.play();
      if (token === activationToken && desiredItem === item) {
        showPlayIndicator(item, false);
        countView(item.dataset.videoId);
      }
    } catch (error) {
      // Mobile browsers may block autoplay with sound. The user can tap the video.
      if (token === activationToken) {
        console.warn("Video playback start failed:", error, video.error || "");
        showPlayIndicator(item, true);
      }
    }
  }

  items.forEach(function(item) {
    const video = item.querySelector(".video-player");
    if (!video) return;
    video.preload = "metadata";
    video.playsInline = true;
    video.addEventListener("error", function() {
      console.error("Glo-Tube video error:", {
        videoId: item.dataset.videoId,
        code: video.error && video.error.code,
        message: video.error && video.error.message,
        source: video.currentSrc
      });
    });
  });

  observer = new IntersectionObserver(function(entries) {
    let best = null;
    entries.forEach(function(entry) {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
        if (!best || entry.intersectionRatio > best.intersectionRatio) best = entry;
      }
    });
    if (best) {
      activateVideo(best.target);
    } else {
      // Pause clips when the feed is not showing one clearly.
      const visible = items.some(item => {
        const r = item.getBoundingClientRect();
        return r.height > 0 && r.top < window.innerHeight * 0.35 && r.bottom > window.innerHeight * 0.65;
      });
      if (!visible) {
        activationToken++;
        desiredItem = null;
        document.querySelectorAll(".video-player").forEach(v => v.pause());
      }
    }
  }, { root: feed, threshold: [0.65, 0.8, 0.95] });

  items.forEach(item => observer.observe(item));
}

async function countView(
  videoId
) {

  if (
    viewedVideos.has(
      String(videoId)
    )
  ) {
    return;
  }

  viewedVideos.add(
    String(videoId)
  );

  const video =
    videos.find(
      function(v) {

        return String(v.id) ===
          String(videoId);

      }
    );

  if (!video) {
    return;
  }

  const newViews =
    Number(
      video.views || 0
    ) + 1;

  const {
    error
  } = await supabaseClient
    .from("videos")
    .update({
      views: newViews
    })
    .eq(
      "id",
      videoId
    );

  if (error) {

    console.error(
      "View update error:",
      error
    );

    return;

  }

  video.views =
    newViews;

}

========================= */

async function likeVideo(
  videoId,
  item
) {

  if (!currentUser) {
    alert("Please log in to like videos.");
    return;
  }

  const button =
    item.querySelector(
      ".like-button"
    );

  const countElement =
    item.querySelector(
      ".like-count"
    );

  const alreadyLiked =
    button.classList.contains(
      "liked"
    );

  button.disabled =
    true;

  try {

    if (alreadyLiked) {

      const {
        error
      } = await supabaseClient
        .from("likes")
        .delete()
        .eq(
          "video_id",
          videoId
        )
        .eq(
          "user_id",
          currentUser.id
        );

      if (error) {
        throw error;
      }

      button.classList.remove(
        "liked"
      );

      countElement.textContent =
        Math.max(
          0,
          Number(
            countElement.textContent
          ) - 1
        );

    } else {

      const {
        error
      } = await supabaseClient
        .from("likes")
        .insert({
          video_id:
            videoId,
          user_id:
            currentUser.id
        });

      if (error) {

        if (
          String(
            error.message
          )
          .toLowerCase()
          .includes("duplicate")
        ) {

          button.classList.add(
            "liked"
          );

        } else {

          throw error;

        }

      } else {

        button.classList.add(
          "liked"
        );

        playLikeSound();

        countElement.textContent =
          Number(
            countElement.textContent
          ) + 1;

      }

    }

  } catch (error) {

    console.error(
      "Like error:",
      error
    );

    alert(
      "Unable to update your like.\n\n" +
      error.message
    );

  }

  button.disabled =
    false;

}

      `Watch @${video.username || "creator"} on Glo-Tube`,

    url:
      videoURL

  };

  try {

    if (
      navigator.share
    ) {

      await navigator.share(
        shareData
      );

    } else {

      await navigator.clipboard
        .writeText(
          videoURL
        );

      alert(
        "Video link copied!"
      );

    }

  } catch (error) {

    console.log(
      "Share cancelled."
    );

  }

}

/* =========================
   HELPERS
========================= */

function escapeHTML(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );

}


function getInitial(
  name
) {

  const value =
    String(
      name || "U"
    ).trim();

  if (!value) {
    return "U";
  }

  return value
    .charAt(0)
    .toUpperCase();

}


function formatDate(
  date
) {

  if (!date) {
    return "";
  }

  const time =
    new Date(date)
      .getTime();

  const difference =
    Math.max(
      0,
      Date.now() - time
    );

  const seconds =
    Math.floor(
      difference / 1000
    );

  if (
    seconds < 60
  ) {
    return "Just now";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if (
    minutes < 60
  ) {

    return (
      minutes +
      (
        minutes === 1
          ? " minute ago"
          : " minutes ago"
      )
    );

  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if (
    hours < 24
  ) {

    return (
      hours +
      (
        hours === 1
          ? " hour ago"
          : " hours ago"
      )
    );

  }

  const days =
    Math.floor(
      hours / 24
    );

  if (
    days < 7
  ) {

    return (
      days +
      (
        days === 1
          ? " day ago"
          : " days ago"
      )
    );

  }

  return new Date(
    date
  ).toLocaleDateString();

}
