<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Glo-Tube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      height: 65px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #e60000;
    }

    .search {
      width: 45%;
      max-width: 500px;
      padding: 11px 16px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 15px;
    }

    .upload-btn {
      background: #e60000;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 22px;
      font-weight: bold;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 12px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin-bottom: 5px;
    }

    .welcome p {
      color: #666;
      margin-top: 0;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .video-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 45px;
    }

    .video-info {
      padding: 15px;
    }

    .username {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      color: #444;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    .actions button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      .search {
        width: 40%;
      }

      .logo {
        font-size: 20px;
      }

      .upload-btn {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Glo-Tube</div>

    <input
      class="search"
      type="search"
      placeholder="Search videos..."
    >

    <a href="#" class="upload-btn">＋ Upload</a>
  </header>

  <main>

    <section class="welcome">
      <h1>Discover videos</h1>
      <p>Watch, share and connect with creators.</p>
    </section>

    <article class="video-card">

      <div class="video-placeholder">
        ▶
      </div>

      <div class="video-info">

        <div class="username">
          @GloTube
        </div>

        <div class="caption">
          Welcome to Glo-Tube! Your new home for discovering and sharing videos.
        </div>

        <div class="actions">
          <button>❤️ Like</button>
          <button>💬 Comment</button>
          <button>↗️ Share</button>
        </div>

      </div>

    </article>

  </main>

</body>

    </html>
