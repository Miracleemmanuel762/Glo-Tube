<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages • Glo-Tube</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff}
.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb;padding:16px}
.toprow{display:flex;align-items:center;gap:12px}
.back{border:0;background:#f1f5f9;width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer}
.title{flex:1}.title h1{margin:0;font-size:21px}.title p{margin:4px 0 0;color:#64748b;font-size:12px}
.search{margin-top:14px}.search input{width:100%;border:0;background:#f1f5f9;border-radius:14px;padding:13px 15px;outline:none}
.list{padding-bottom:90px}
.conversation{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:#fff;text-align:left;cursor:pointer}
.conversation:hover{background:#f8fafc}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#2196f3;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.info{min-width:0;flex:1}.line{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:11px;color:#94a3b8;white-space:nowrap}
.preview{margin:5px 0 0;color:#64748b;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#2196f3;color:#fff;font-size:11px;display:grid;place-items:center}
.empty{padding:75px 25px;text-align:center;color:#64748b}.empty strong{display:block;color:#111827;font-size:18px;margin-bottom:7px}.empty-icon{font-size:45px;margin-bottom:12px}
.compose{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:82px;width:54px;height:54px;border:0;border-radius:50%;background:#2196f3;color:#fff;font-size:27px;box-shadow:0 8px 22px #0002;cursor:pointer;z-index:10}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);height:68px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;align-items:center;z-index:20}
.nav a{text-decoration:none;color:#64748b;font-size:11px;text-align:center}.nav a span{display:block;font-size:21px;margin-bottom:3px}.nav a.active{color:#2196f3;font-weight:700}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<div class="toprow">
<button class="back" onclick="history.back()">‹</button>
<div class="title"><h1>Messages</h1><p>Private conversations on Glo-Tube</p></div>
</div>
<div class="search"><input id="searchInput" type="search" placeholder="Search conversations..."></div>
</header>
<section id="conversationList" class="list">
<div class="empty">Loading messages...</div>
</section>
</main>

<button class="compose" id="composeButton" aria-label="New message">＋</button>

<nav class="nav">
<a href="home.html"><span>⌂</span>Home</a>
<a href="discover.html"><span>⌕</span>Discover</a>
<a href="upload.html"><span>＋</span>Upload</a>
<a href="notifications.html"><span>♡</span>Alerts</a>
<a href="profile.html"><span>●</span>Profile</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let currentUser=null;
let conversations=[];

const $=id=>document.getElementById(id);

async function boot(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error||!data.session){location.replace("login.html");return}
  currentUser=data.session.user;
  await loadMessages();
}

async function loadMessages(){
  const list=$("conversationList");
  try{
    const {data,error}=await supabaseClient
      .from("messages")
      .select("id,sender_id,receiver_id,message,created_at,is_read")
      .or("sender_id.eq."+currentUser.id+",receiver_id.eq."+currentUser.id)
      .order("created_at",{ascending:false});

    if(error)throw error;

    const rows=data||[];
    const ids=[...new Set(rows.map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id))];

    if(!ids.length){conversations=[];renderMessages();return}

    const {data:profiles,error:pe}=await supabaseClient
      .from("profiles")
      .select("id,username,first_name,last_name,profile_photo")
      .in("id",ids);

    if(pe)throw pe;

    const map=Object.fromEntries((profiles||[]).map(p=>[p.id,p]));
    const grouped=new Map();

    rows.forEach(row=>{
      const other=row.sender_id===currentUser.id?row.receiver_id:row.sender_id;
      if(!grouped.has(other)){
        grouped.set(other,{
          user:map[other]||{id:other,username:"User"},
          message:row.message||"",
          created_at:row.created_at,
          unread:row.receiver_id===currentUser.id&&!row.is_read
        });
      }else if(row.receiver_id===currentUser.id&&!row.is_read){
        grouped.get(other).unread=true;
      }
    });

    conversations=[...grouped.values()];
    renderMessages();
  }catch(error){
    console.error("Messages error:",error);
    list.innerHTML='<div class="empty"><div class="empty-icon">💬</div><strong>Messages are not ready yet</strong><span>The messages database table has not been created yet.</span></div>';
  }
}

function renderMessages(){
  const list=$("conversationList");
  const q=$("searchInput").value.trim().toLowerCase();

  const filtered=conversations.filter(c=>{
    const u=c.user||{};
    return (`${u.first_name||""} ${u.last_name||""} ${u.username||""}`).toLowerCase().includes(q);
  });

  if(!filtered.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">💬</div><strong>No conversations yet</strong><span>Start a conversation with a creator and it will appear here.</span></div>';
    return;
  }

  list.innerHTML=filtered.map(c=>{
    const u=c.user||{};
    const name=(`${u.first_name||""} ${u.last_name||""}`).trim()||u.username||"User";
    const initial=name.charAt(0).toUpperCase();
    const avatar=u.profile_photo
      ? `<img class="avatar" src="${escapeHtml(u.profile_photo)}" alt="">`
      : `<div class="avatar">${escapeHtml(initial)}</div>`;

    return `<button class="conversation" data-user="${escapeHtml(u.id)}">
      ${avatar}
      <div class="info">
        <div class="line">
          <div class="name">${escapeHtml(name)}</div>
          <div class="time">${relativeTime(c.created_at)}</div>
        </div>
        <div class="preview">${escapeHtml(c.message||"Start a conversation")}</div>
      </div>
      ${c.unread?'<span class="unread">1</span>':""}
    </button>`;
  }).join("");
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function relativeTime(date){
  const s=Math.max(0,Math.floor((Date.now()-new Date(date).getTime())/1000));
  if(s<60)return"now";
  if(s<3600)return Math.floor(s/60)+"m";
  if(s<86400)return Math.floor(s/3600)+"h";
  if(s<604800)return Math.floor(s/86400)+"d";
  return new Date(date).toLocaleDateString();
}

$("searchInput").addEventListener("input",renderMessages);

$("conversationList").addEventListener("click",e=>{
  const item=e.target.closest("[data-user]");
  if(item)location.href="chat.html?user="+encodeURIComponent(item.dataset.user);
});

$("composeButton").addEventListener("click",()=>location.href="discover.html");

boot();
</script>
</body>
</html>
