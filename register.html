<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e60000">

  <title>Create Account | Glo-Tube</title>

  <meta
    name="description"
    content="Create your Glo-Tube account and join the community."
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #eeeeee;
    }

    .logo {
      text-align: center;
      color: #e60000;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .subtitle {
      text-align: center;
      color: #666666;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 30px;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #333333;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #f5f5f5;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #222222;
      transition: box-shadow 0.2s;
    }

    input::placeholder {
      color: #999999;
    }

    input:focus {
      border-color: #cc0000;
      box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.08);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 5px;
      background: transparent;
      color: #e60000;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: transparent;
      color: #b30000;
    }

    .password-hint {
      font-size: 12px;
      color: #777777;
      margin: 7px 0 0;
      line-height: 1.5;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 20px 0;
      font-size: 12px;
      color: #555555;
      line-height: 1.6;
    }

    .terms input {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #e60000;
      cursor: pointer;
    }

    .terms label {
      margin: 0;
      font-weight: normal;
      font-size: 12px;
    }

    .terms a {
      color: #e60000;
      text-decoration: none;
      font-weight: bold;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .register-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e60000;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .register-button:hover {
      background: #cc0000;
    }

    .register-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      color: #176b35;
      background: #eaf8ee;
      border: 1px solid #b8e6c5;
    }

    .message.error {
      display: block;
      color: #b00020;
      background: #fff0f0;
      border: 1px solid #ffcaca;
    }

    .message a {
      color: #e60000;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 24px;
      color: #666666;
      font-size: 14px;
      line-height: 1.7;
    }

    .login a {
      color: #e60000;
      font-weight: bold;
      text-decoration: none;
    }

    .login a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 22px;
      color: #888888;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer strong {
      color: #e60000;
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .container {
        padding: 28px 22px;
      }

      .logo {
        font-size: 28px;
      }

    }

  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      Glo-Tube
    </div>

    <p class="subtitle">
      Create your account and join the community.
    </p>


    <form id="registerForm">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Choose a username"
          minlength="3"
          maxlength="30"
          pattern="[A-Za-z0-9_]+"
          title="Use letters, numbers, and underscores only."
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="email">
          Email address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="password"
          >
            Show
          </button>

        </div>

        <p class="password-hint">
          Your password must contain at least 8 characters.
        </p>

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirm password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
          >
            Show
          </button>

        </div>

      </div>


      <div class="terms">

        <input
          type="checkbox"
          id="agreeTerms"
          required
        >

        <label for="agreeTerms">
          I agree to the Glo-Tube
          <a href="https://glo-tube.vercel.app/terms.html">
            Terms of Service
          </a>
          and
          <a href="https://glo-tube.vercel.app/privacy.html">
            Privacy Policy
          </a>.
        </label>

      </div>


      <button
        type="submit"
        class="register-button"
        id="registerButton"
      >
        Create Account
      </button>

    </form>


    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>


    <div class="login">

      Already have an account?

      <a href="https://glo-tube.vercel.app/login.html">
        Login
      </a>

    </div>

  </main>


  <footer class="footer">

    &copy; <span id="year"></span> Glo-Tube.

    Developed by <strong>GlobalMedia Development</strong>.

  </footer>


  <script>

    // =========================================
    // SUPABASE CONFIGURATION
    // =========================================

    const SUPABASE_URL =
      "https://iajjkzphwzkacibkrdhb.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhamprenBod3prYWNpYmtyZGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Mzg3MjgsImV4cCI6MjEwNzIxNDcyOH0.ATB6rsZCC7nkoIf7IL938POFTUEP-SIM6eyx6dNe9ZQ";


    // =========================================
    // INITIALIZE SUPABASE
    // =========================================

    let supabaseClient = null;

    const messageBox =
      document.getElementById("message");

    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");


    document.getElementById("year").textContent =
      new Date().getFullYear();


    function showMessage(text, type) {

      messageBox.className = "message " + type;

      messageBox.textContent = text;

    }


    try {

      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        throw new Error(
          "The Supabase library did not load. Check your internet connection."
        );

      }

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

    } catch (error) {

      console.error(
        "Supabase initialization error:",
        error
      );

      showMessage(
        error.message,
        "error"
      );

    }


    // =========================================
    // SHOW / HIDE PASSWORD
    // =========================================

    document
      .querySelectorAll(".toggle-password")
      .forEach(function(button) {

        button.addEventListener("click", function() {

          const input = document.getElementById(
            button.dataset.target
          );

          if (input.type === "password") {

            input.type = "text";
            button.textContent = "Hide";

          } else {

            input.type = "password";
            button.textContent = "Show";

          }

        });

      });


    // =========================================
    // CHECK EXISTING SESSION
    // =========================================

    async function checkSession() {

      if (!supabaseClient) {
        return;
      }

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          console.error(error.message);
          return;
        }

        if (data.session) {

          window.location.replace(
            "https://glo-tube.vercel.app/welcome.html"
          );

        }

      } catch (error) {

        console.error(
          "Session error:",
          error
        );

      }

    }

    checkSession();


    // =========================================
    // REGISTER ACCOUNT
    // =========================================

    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        if (!supabaseClient) {

          showMessage(
            "Supabase is not connected. Refresh the page and try again.",
            "error"
          );

          return;

        }


        const username =
          document.getElementById("username")
            .value.trim();

        const email =
          document.getElementById("email")
            .value.trim();

        const password =
          document.getElementById("password")
            .value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;


        // Validate username.

        if (!/^[A-Za-z0-9_]{3,30}$/.test(username)) {

          showMessage(
            "Username must contain 3–30 letters, numbers, or underscores.",
            "error"
          );

          return;

        }


        // Validate matching passwords.

        if (password !== confirmPassword) {

          showMessage(
            "Your passwords do not match.",
            "error"
          );

          return;

        }


        if (password.length < 8) {

          showMessage(
            "Your password must contain at least 8 characters.",
            "error"
          );

          return;

        }


        registerButton.disabled = true;

        registerButton.textContent =
          "Creating account...";

        messageBox.className = "message";

        messageBox.textContent = "";


        try {

          const {
            data,
            error
          } = await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                username: username
              },

              emailRedirectTo:
                "https://glo-tube.vercel.app/email-confirmation.html"

            }

          });


          if (error) {

            console.error(
              "Supabase signup error:",
              error
            );

            showMessage(
              error.message,
              "error"
            );

            return;

          }


          // If a session exists, registration is complete
          // and Supabase has authenticated the user.

          if (data.session) {

            showMessage(
              "Account created successfully! Redirecting to Glo-Tube...",
              "success"
            );

            window.location.replace(
              "https://glo-tube.vercel.app/home.html"
            );

            return;

          }


          // No session generally means email confirmation
          // is required. Do not falsely claim verification.

          showMessage(
            "Your registration was successful! Please check your email and click the confirmation link to activate your Glo-Tube account.",
            "success"
          );


          registerForm.reset();


        } catch (error) {

          console.error(
            "Unexpected registration error:",
            error
          );

          showMessage(
            "Unable to connect to Supabase. Check your internet connection and try again.",
            "error"
          );

        } finally {

          registerButton.disabled = false;

          registerButton.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>

  </html>
