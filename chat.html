<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Glo-Tube Chat</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #087cff;
      --background: #f4f7fb;
      --border: #e6ebf2;
      --text: #172033;
      --muted: #758197;
      --sent: #dceeff;
      --received: #ffffff;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      height: 100dvh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    .app {
      height: 100dvh;
      max-width: 760px;
      margin: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .top {
      height: 68px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex-shrink: 0;
    }

    .back {
      font-size: 28px;
      background: transparent;
      color: var(--blue);
      padding: 4px;
    }

    .avatar {
      height: 42px;
      width: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8f2ff;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-weight: bold;
      overflow: hidden;
      flex-shrink: 0;
    }

    .person {
      min-width: 0;
      flex: 1;
    }

    .person strong {
      display: block;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .head-action {
      background: #f1f6fc;
      color: #23527c;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 20px;
    }

    /* NOTICE */

    .notice {
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
      color: #2471b8;
      background: #edf6ff;
      display: none;
      overflow-wrap: anywhere;
    }

    .notice.show {
      display: block;
    }

    /* MESSAGE AREA */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 12px 12px;
      background-color: #f6f8fb;
      background-image:
        radial-gradient(#dce5f0 0.6px, transparent 0.6px);
      background-size: 15px 15px;
      scroll-behavior: smooth;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      margin: 35px auto;
      font-size: 14px;
      line-height: 1.6;
    }

    /* MESSAGE ROWS */

    .row {
      display: flex;
      margin: 12px 0;
      align-items: flex-end;
      gap: 6px;
    }

    .row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(82%, 520px);
      padding: 9px 10px 6px;
      border-radius: 15px;
      background: var(--received);
      box-shadow: 0 1px 2px #16233b12;
      overflow-wrap: anywhere;
      position: relative;
    }

    .mine .bubble {
      background: var(--sent);
      border-bottom-right-radius: 4px;
    }

    .row:not(.mine) .bubble {
      border-bottom-left-radius: 4px;
    }

    .msg-text {
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 15px;
    }

    /* MESSAGE TIME */

    .meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #77849a;
      margin-top: 5px;
    }

    .ticks {
      color: #1685df;
      font-size: 13px;
    }

    /* REPLY PREVIEW */

    .reply-quote {
      border-left: 3px solid var(--blue);
      padding: 7px 9px;
      background: #e9f2fc;
      border-radius: 5px;
      margin-bottom: 7px;
      font-size: 12px;
      color: #43536a;
    }

    .reply-quote b {
      display: block;
      color: #1269bd;
      margin-bottom: 3px;
    }

    /* MESSAGE ACTIONS */

    .msg-tools {
      display: flex;
      gap: 4px;
      margin-bottom: 5px;
      justify-content: flex-end;
    }

    .tool {
      background: #ffffffb8;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 4px 9px;
      font-size: 11px;
      color: #42516a;
    }

    /* MEDIA */

    .media {
      max-width: 100%;
      max-height: 320px;
      border-radius: 9px;
      display: block;
      margin: 2px 0 5px;
    }

    .audio-player {
      width: min(260px, 65vw);
      display: block;
    }

    .file-card {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #f0f5fb;
      border-radius: 8px;
      color: #23415e;
      text-decoration: none;
    }

    .file-icon {
      font-size: 25px;
    }

    /* REPLY BAR */

    .reply-bar {
      display: none;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      background: #f3f8ff;
      border-top: 1px solid var(--border);
    }

    .reply-bar.show {
      display: flex;
    }

    .reply-copy {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: #65738a;
    }

    .reply-copy b {
      display: block;
      color: #1672ce;
      margin-bottom: 3px;
    }

    .reply-copy span {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cancel {
      background: transparent;
      color: #718096;
      font-size: 23px;
    }

    /* MESSAGE COMPOSER */

    .composer {
      padding: 10px;
      display: flex;
      gap: 7px;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #f0f5fb;
      color: #2471b8;
      font-size: 19px;
      display: grid;
      place-items: center;
    }

    .icon-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    .input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      background: #f3f6fa;
      border-radius: 22px;
      padding: 5px 12px;
    }

    .input-wrap textarea {
      border: 0;
      outline: 0;
      background: transparent;
      resize: none;
      max-height: 120px;
      min-height: 30px;
      flex: 1;
      padding: 7px 0;
      line-height: 1.35;
      color: var(--text);
    }

    .send {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 18px;
      flex-shrink: 0;
    }

    .send:disabled {
      opacity: .5;
    }

    .recording {
      font-size: 12px;
      color: #d63031;
      align-self: center;
      white-space: nowrap;
      display: none;
    }

    .recording.show {
      display: block;
    }

    @media (min-width: 600px) {
      body {
        padding: 12px 0;
      }

      .app {
        height: calc(100dvh - 24px);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 0 35px #14213d0d;
      }

      .top {
        padding: 12px 18px;
      }

      #messages {
        padding: 22px 20px;
      }

      .composer {
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- CHAT HEADER -->

  <header class="top">

    <button
      class="back"
      id="backBtn"
      aria-label="Go back">
      ‹
    </button>

    <div class="avatar" id="avatar">G</div>

    <div class="person">

      <strong id="personName">
        Glo-Tube User
      </strong>

      <div class="status" id="status">
        Glo-Tube messages
      </div>

    </div>

    <button
      class="head-action"
      id="refreshBtn"
      title="Refresh messages">
      ↻
    </button>

  </header>

  <div class="notice" id="notice"></div>

  <!-- MESSAGES -->

  <main id="messages" aria-live="polite">

    <div class="empty">
      Loading conversation...
    </div>

  </main>

  <!-- REPLY PREVIEW -->

  <div class="reply-bar" id="replyBar">

    <div class="reply-copy">

      <b id="replyName">
        Replying
      </b>

      <span id="replyText"></span>

    </div>

    <button
      class="cancel"
      id="cancelReply"
      aria-label="Cancel reply">
      ×
    </button>

  </div>

  <!-- MESSAGE INPUT -->

  <form class="composer" id="composer">

    <button
      type="button"
      class="icon-btn"
      id="attachBtn"
      title="Attach a file">
      ＋
    </button>

    <input
      id="fileInput"
      type="file"
      hidden
      accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip">

    <div class="input-wrap">

      <textarea
        id="messageInput"
        placeholder="Message"
        rows="1"
        aria-label="Write a message"></textarea>

      <span class="recording" id="recordingLabel">
        ● Recording
      </span>

    </div>

    <button
      type="button"
      class="icon-btn"
      id="voiceBtn"
      title="Record voice message">
      🎙
    </button>

    <button
      class="send"
      id="sendBtn"
      type="submit"
      title="Send message">
      ➤
    </button>

  </form>

</div>

<script>
(() => {

  "use strict";

  const $ = id => document.getElementById(id);

  /*
    IMPORTANT:

    supabase.js must expose the initialized client
    as window.supabaseClient.

    Example:
    window.supabaseClient =
      window.supabase.createClient(URL, KEY);
  */

  const client = window.supabaseClient;

  const showNotice = (message, warning = false) => {

    const notice = $("notice");

    notice.textContent = message;

    notice.style.color = warning
      ? "#b42318"
      : "#2471b8";

    notice.classList.add("show");

    setTimeout(() => {
      notice.classList.remove("show");
    }, 5000);

  };

  if (!client || typeof client.from !== "function") {

    $("messages").innerHTML = `
      <div class="empty">
        <b>Supabase is not connected.</b><br><br>
        Check your supabase.js file and make sure
        it creates window.supabaseClient.
      </div>
    `;

    return;

  }

  let currentUser = null;
  let otherId = null;
  let otherProfile = null;

  let lastIds = new Set();
  let replyTo = null;

  let mediaRecorder = null;
  let recordingStream = null;
  let chunks = [];

  let pollTimer = null;

  const params = new URLSearchParams(location.search);

  otherId =
    params.get("user") ||
    params.get("user_id") ||
    params.get("id");

  /* Escape HTML before displaying database content. */

  function escapeHtml(value) {

    return String(value ?? "").replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]
    );

  }

  function formatTime(value) {

    if (!value) return "";

    const date = new Date(value);

    return date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  }

  function messageText(message) {

    return message.message ||
      message.content ||
      "";

  }

  function profileName(profile) {

    if (!profile) {
      return "Glo-Tube User";
    }

    if (profile.username) {
      return "@" + profile.username;
    }

    return [
      profile.first_name,
      profile.last_name
    ].filter(Boolean).join(" ") || "Glo-Tube User";

  }

  /* START CHAT */

  async function init() {

    try {

      const {
        data: { session },
        error
      } = await client.auth.getSession();

      if (error) throw error;

      if (!session || !session.user) {

        location.href = "login.html";
        return;

      }

      currentUser = session.user;

      if (!otherId) {

        $("messages").innerHTML = `
          <div class="empty">
            No conversation selected.<br><br>
            Open a user's chat from your messages list.
          </div>
        `;

        return;

      }

      if (otherId === currentUser.id) {

        showNotice(
          "Choose another user to start a conversation.",
          true
        );

        return;

      }

      await loadOtherProfile();

      await loadMessages(true);

      /*
        Fallback polling keeps messages refreshing.
        This is not instant real-time delivery.
      */

      pollTimer = setInterval(() => {
        loadMessages(false);
      }, 5000);

    } catch (error) {

      console.error(error);

      showNotice(
        error.message || "Could not open the chat.",
        true
      );

    }

  }

  /* LOAD THE OTHER USER'S PROFILE */

  async function loadOtherProfile() {

    const { data, error } = await client
      .from("profiles")
      .select(
        "id,username,first_name,last_name,profile_photo"
      )
      .eq("id", otherId)
      .maybeSingle();

    if (error) {
      console.warn("Profile lookup:", error.message);
    }

    otherProfile = data || {
      id: otherId
    };

    $("personName").textContent =
      profileName(otherProfile);

    if (otherProfile.profile_photo) {

      const image = document.createElement("img");

      image.src = otherProfile.profile_photo;
      image.alt = "";
      image.style.width = "100%";
      image.style.height = "100%";
      image.style.objectFit = "cover";

      $("avatar").replaceChildren(image);

    } else {

      $("avatar").textContent = (
        otherProfile.username ||
        otherProfile.first_name ||
        "G"
      ).slice(0, 1).toUpperCase();

    }

  }

  /* REPLY QUOTE */

  function replyPreview(message) {

    const text =
      messageText(message) ||
      message.attachment_name ||
      (
        message.message_type === "voice"
          ? "Voice message"
          : "Attachment"
      );

    const sender = message.sender_id === currentUser.id
      ? "You"
      : profileName(otherProfile);

    return `
      <div class="reply-quote">

        <b>${escapeHtml(sender)}</b>

        ${escapeHtml(text.slice(0, 180))}

      </div>
    `;

  }

  /* RENDER MESSAGE CONTENT */

  function contentHtml(message) {

    const type = message.message_type || "text";

    const url = message.attachment_url;

    const name =
      message.attachment_name ||
      "Attachment";

    if (type === "image" && url) {

      return `
        <a
          href="${escapeHtml(url)}"
          target="_blank"
          rel="noopener">

          <img
            class="media"
            src="${escapeHtml(url)}"
            alt="${escapeHtml(name)}"
            loading="lazy">

        </a>

        ${
          messageText(message)
            ? `<div class="msg-text">${escapeHtml(messageText(message))}</div>`
            : ""
        }
      `;

    }

    if (type === "video" && url) {

      return `
        <video
          class="media"
          src="${escapeHtml(url)}"
          controls
          playsinline
          preload="metadata">
        </video>

        ${
          messageText(message)
            ? `<div class="msg-text">${escapeHtml(messageText(message))}</div>`
            : ""
        }
      `;

    }

    if (
      (type === "voice" || type === "audio") &&
      url
    ) {

      return `
        <audio
          class="audio-player"
          src="${escapeHtml(url)}"
          controls
          preload="metadata">
        </audio>
      `;

    }

    if (type === "file" && url) {

      return `
        <a
          class="file-card"
          href="${escapeHtml(url)}"
          target="_blank"
          rel="noopener">

          <span class="file-icon">📎</span>

          <span>
            <b>${escapeHtml(name)}</b><br>
            <small>Open or download file</small>
          </span>

        </a>

        ${
          messageText(message)
            ? `<div class="msg-text">${escapeHtml(messageText(message))}</div>`
            : ""
        }
      `;

    }

    return `
      <div class="msg-text">
        ${escapeHtml(messageText(message))}
      </div>
    `;

  }

  /* DISPLAY ALL MESSAGES */

  function renderMessages(list, initial = false) {

    const box = $("messages");

    const nearBottom =
      box.scrollHeight -
      box.scrollTop -
      box.clientHeight < 100;

    if (!list.length) {

      box.innerHTML = `
        <div class="empty">
          No messages yet.<br><br>
          Say hello 👋
        </div>
      `;

      return;

    }

    const html = list.map(message => {

      const mine =
        message.sender_id === currentUser.id;

      const repliedMessage = message.reply_to
        ? list.find(item =>
            String(item.id) === String(message.reply_to)
          )
        : null;

      const isRead = Boolean(
        message.is_read ||
        message.read_at
      );

      return `
        <div
          class="row ${mine ? "mine" : ""}"
          data-id="${escapeHtml(message.id)}">

          <div class="bubble">

            <div class="msg-tools">

              <button
                class="tool reply-btn"
                data-reply="${escapeHtml(message.id)}">

                ↩ Reply

              </button>

            </div>

            ${
              repliedMessage
                ? replyPreview(repliedMessage)
                : ""
            }

            ${contentHtml(message)}

            <div class="meta">

              <span>
                ${formatTime(message.created_at)}
              </span>

              ${
                mine
                  ? `
                    <span
                      class="ticks"
                      title="${isRead ? "Read" : "Sent"}">

                      ${isRead ? "✓✓" : "✓"}

                    </span>
                  `
                  : ""
              }

            </div>

          </div>

        </div>
      `;

    }).join("");

    box.innerHTML = html;

    box.querySelectorAll("[data-reply]")
      .forEach(button => {

        button.addEventListener("click", () => {

          const message = list.find(item =>
            String(item.id) === button.dataset.reply
          );

          setReply(message);

        });

      });

    if (initial || nearBottom) {
      box.scrollTop = box.scrollHeight;
    }

  }

  /* FETCH CONVERSATION */

  async function loadMessages(initial = false) {

    if (!currentUser || !otherId) return;

    try {

      const { data, error } = await client
        .from("messages")
        .select("*")
        .or(
          `and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`
        )
        .order("created_at", {
          ascending: true
        })
        .limit(300);

      if (error) throw error;

      const list = data || [];

      renderMessages(
        list,
        initial || lastIds.size === 0
      );

      lastIds = new Set(
        list.map(message => String(message.id))
      );

      $("status").textContent =
        "Glo-Tube messages";

      /*
        Mark received messages as read.

        Your messages table must have an is_read
        boolean column for this feature.
      */

      const unread = list.filter(message =>
        message.sender_id === otherId &&
        !message.is_read
      );

      if (unread.length) {

        const ids = unread.map(message => message.id);

        const { error: readError } = await client
          .from("messages")
          .update({
            is_read: true
          })
          .in("id", ids);

        if (readError) {

          console.warn(
            "Read receipt update:",
            readError.message
          );

        }

      }

    } catch (error) {

      console.error(error);

      showNotice(
        "Could not refresh messages: " +
        (error.message || "check your database setup"),
         true
      );

    }

  }

  /* SELECT A MESSAGE TO REPLY TO */

  function setReply(message) {

    if (!message) return;

    replyTo = message;

    $("replyName").textContent =
      message.sender_id === currentUser.id
        ? "Replying to your message"
        : "Replying to " + profileName(otherProfile);

    $("replyText").textContent =
      messageText(message) ||
      message.attachment_name ||
      (
        message.message_type === "voice"
          ? "Voice message"
          : "Attachment"
      );

    $("replyBar").classList.add("show");

    $("messageInput").focus();

  }

  function clearReply() {

    replyTo = null;

    $("replyBar").classList.remove("show");

  }

  $("cancelReply").addEventListener(
    "click",
    clearReply
  );

  /* SEND A MESSAGE TO SUPABASE */

  async function insertMessage(payload) {

    const fullMessage = {
      sender_id: currentUser.id,
      receiver_id: otherId,
      ...payload
    };

    const { error } = await client
      .from("messages")
      .insert(fullMessage);

    if (error) throw error;

    clearReply();

    await loadMessages(false);

  }

  /* SEND TEXT MESSAGES */

  $("composer").addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const input = $("messageInput");
      const text = input.value.trim();

      if (!text) return;

      $("sendBtn").disabled = true;

      try {

        await insertMessage({
          message: text,
          message_type: "text",
          reply_to: replyTo?.id ?? null
        });

        input.value = "";
        input.style.height = "auto";

      } catch (error) {

        console.error(error);

        showNotice(
          "Message not sent: " +
          (error.message || "Check your database policies"),
          true
        );

      } finally {

        $("sendBtn").disabled = false;
        input.focus();

      }

    }
  );

  /* AUTO-RESIZE THE TEXT INPUT */

  $("messageInput").addEventListener(
    "input",
    function () {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 120) + "px";

    }
  );

  /* OPEN FILE PICKER */

  $("attachBtn").addEventListener(
    "click",
    () => $("fileInput").click()
  );

  /* UPLOAD AND SEND ATTACHMENTS */

  $("fileInput").addEventListener(
    "change",
    async event => {

      const file = event.target.files?.[0];

      if (!file) return;

      if (file.size > 25 * 1024 * 1024) {

        showNotice(
          "Choose a file smaller than 25 MB.",
          true
        );

        event.target.value = "";

        return;

      }

      $("attachBtn").disabled = true;

      showNotice("Uploading " + file.name + "...");

      try {

        const safeName = file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

        const path =
          `${currentUser.id}/${Date.now()}_${safeName}`;

        const { error: uploadError } = await client
          .storage
          .from("chat-attachments")
          .upload(path, file, {
            upsert: false,
            contentType:
              file.type || "application/octet-stream"
          });

        if (uploadError) throw uploadError;

        const { data } = client
          .storage
          .from("chat-attachments")
          .getPublicUrl(path);

        let type = "file";

        if (file.type.startsWith("image/")) {
          type = "image";
        } else if (file.type.startsWith("video/")) {
          type = "video";
        } else if (file.type.startsWith("audio/")) {
          type = "audio";
        }

        await insertMessage({
          message: "",
          message_type: type,
          attachment_url: data.publicUrl,
          attachment_name: file.name,
          attachment_type:
            file.type || "application/octet-stream",
          reply_to: replyTo?.id ?? null
        });

        showNotice("Attachment sent successfully.");

      } catch (error) {

        console.error(error);

        showNotice(
          "Upload failed: " +
          (error.message || "Check Storage settings"),
          true
        );

      } finally {

        $("attachBtn").disabled = false;
        event.target.value = "";

      }

    }
  );

  /* RECORD AND SEND VOICE MESSAGES */

  $("voiceBtn").addEventListener(
    "click",
    async () => {

      /* Tap again to stop recording and send. */

      if (mediaRecorder?.state === "recording") {

        mediaRecorder.stop();

        return;

      }

      if (
        !navigator.mediaDevices?.getUserMedia ||
        !window.MediaRecorder
      ) {

        showNotice(
          "Voice recording is not supported in this browser.",
          true
        );

        return;

      }

      try {

        recordingStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        chunks = [];

        let options = {};

        if (
          MediaRecorder.isTypeSupported(
            "audio/webm;codecs=opus"
          )
        ) {

          options = {
            mimeType: "audio/webm;codecs=opus"
          };

        }

        mediaRecorder = new MediaRecorder(
          recordingStream,
          options
        );

        mediaRecorder.ondataavailable = event => {

          if (event.data.size) {
            chunks.push(event.data);
          }

        };

        mediaRecorder.onstop = async () => {

          recordingStream
            ?.getTracks()
            .forEach(track => track.stop());

          recordingStream = null;

          $("recordingLabel")
            .classList.remove("show");

          $("voiceBtn").textContent = "🎙";

          const blob = new Blob(chunks, {
            type:
              mediaRecorder.mimeType || "audio/webm"
          });

          if (!blob.size) return;

          if (blob.size > 25 * 1024 * 1024) {

            showNotice(
              "Voice recording is too large.",
              true
            );

            return;

          }

          $("voiceBtn").disabled = true;

          showNotice("Sending voice message...");

          try {

            const path =
              `${currentUser.id}/${Date.now()}_voice.webm`;

            const { error } = await client
              .storage
              .from("chat-attachments")
              .upload(path, blob, {
                contentType: blob.type,
                upsert: false
              });

            if (error) throw error;

            const { data } = client
              .storage
              .from("chat-attachments")
              .getPublicUrl(path);

            await insertMessage({
              message: "",
              message_type: "voice",
              attachment_url: data.publicUrl,
              attachment_name: "Voice message",
              attachment_type: blob.type,
              reply_to: replyTo?.id ?? null
            });

            showNotice("Voice message sent.");

          } catch (error) {

            console.error(error);

            showNotice(
              "Voice message failed: " +
              (error.message || "Check Storage settings"),
              true
            );

          } finally {

            $("voiceBtn").disabled = false;

          }

        };

        mediaRecorder.start();

        $("recordingLabel").classList.add("show");

        $("voiceBtn").textContent = "■";

        showNotice(
          "Recording... Tap ■ to stop and send."
        );

      } catch (error) {

        console.error(error);

        showNotice(
          "Microphone permission was denied or unavailable.",
          true
        );

      }

    }
  );

  /* REFRESH MESSAGES */

  $("refreshBtn").addEventListener(
    "click",
    () => loadMessages(false)
  );

  /* BACK BUTTON */

  $("backBtn").addEventListener(
    "click",
    () => {

      if (history.length > 1) {

        history.back();

      } else {

        location.href = "messages.html";

      }

    }
  );

  /* CLEAN UP WHEN LEAVING */

  window.addEventListener(
    "beforeunload",
    () => {

      if (pollTimer) {
        clearInterval(pollTimer);
      }

      recordingStream
        ?.getTracks()
        .forEach(track => track.stop());

    }
  );

  /* START THE CHAT */

  init();

})();
</script>

</body>
</html>
