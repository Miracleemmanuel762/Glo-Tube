<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat • Glo-Tube</title>
<style>
*{box-sizing:border-box} :root{--blue:#2196f3;--ink:#111827;--muted:#64748b;--line:#e2e8f0;--page:#f1f5f9}
body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{max-width:620px;margin:auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}.toprow{display:flex;align-items:center;gap:10px}.back,.iconbtn{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;background:#f1f5f9;font-size:23px;cursor:pointer;color:#172033}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--blue);color:white;display:grid;place-items:center;font-weight:700;flex:0 0 42px}.person{min-width:0;flex:1}.person h1{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person p{margin:3px 0 0;color:var(--muted);font-size:12px}.messages{flex:1;padding:16px 12px 145px;overflow-y:auto;background:#f8fafc;min-height:calc(100dvh - 150px);scroll-behavior:smooth}.state{text-align:center;padding:55px 18px;color:var(--muted);line-height:1.6}.error{color:#b91c1c}.bubble-row{display:flex;margin:8px 0;align-items:flex-end;gap:5px}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:84%;min-width:80px;padding:10px 12px;border-radius:16px;background:#e2e8f0;color:var(--ink);font-size:14px;line-height:1.45;overflow-wrap:anywhere}.mine .bubble{background:#2196f3;color:#fff;border-bottom-right-radius:5px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}.message-text{white-space:pre-wrap}.meta{font-size:10px;opacity:.75;margin-top:5px;text-align:right}.reply-preview{border-left:3px solid var(--blue);padding:5px 8px;margin-bottom:7px;border-radius:4px;background:#ffffff80;font-size:12px;color:#334155;cursor:pointer}.mine .reply-preview{border-color:#fff;color:#fff;background:#00000012}.reply-name{font-weight:700;margin-bottom:2px}.attachment{display:block;max-width:100%;border-radius:10px;margin:3px 0 5px}.attachment img,.attachment video{display:block;max-width:100%;max-height:300px;border-radius:9px}.attachment audio{max-width:100%;width:260px}.file-link{display:flex;gap:9px;align-items:center;padding:10px;border-radius:10px;background:#ffffff70;color:inherit;text-decoration:none;overflow-wrap:anywhere}.mine .file-link{background:#00000012}.bubble-actions{display:flex;gap:10px;margin-top:5px;font-size:11px}.bubble-actions button{border:0;background:transparent;color:inherit;opacity:.8;padding:2px 0;cursor:pointer}.composer-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);z-index:20;background:#fff;border-top:1px solid var(--line);padding:7px 9px calc(8px + env(safe-area-inset-bottom))}.replying{display:none;align-items:center;gap:8px;padding:7px 9px;margin-bottom:6px;background:#eff6ff;border-left:3px solid var(--blue);border-radius:7px;font-size:12px;color:#334155}.replying.show{display:flex}.replying-text{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.replying button{border:0;background:transparent;font-size:18px;cursor:pointer}.composer{display:flex;align-items:center;gap:6px}.composer input[type=text]{flex:1;min-width:0;border:1px solid #dbe2ea;border-radius:24px;padding:13px 14px;outline:none;font-size:14px}.composer input:focus{border-color:var(--blue)}.send,.toolbtn{width:43px;height:43px;flex:0 0 43px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:18px;cursor:pointer}.toolbtn{background:#eef2f7;color:#334155}.send:disabled,.toolbtn:disabled{opacity:.5;cursor:wait}.recording{background:#dc2626!important;color:#fff!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}.hint{font-size:11px;color:var(--muted);padding:3px 4px 0}.statusline{font-size:12px;color:var(--muted);padding:3px 6px;min-height:16px}.uploading{opacity:.65}.hidden{display:none!important}
@media(min-width:621px){body{padding:12px 0}.app{min-height:calc(100dvh - 24px);border-radius:14px;overflow:hidden;box-shadow:0 5px 30px #0f172a12}.messages{min-height:calc(100dvh - 175px)}}
</style>
</head>
<body><main class="app">
<header class="topbar"><div class="toprow"><button class="back" id="backButton" type="button" aria-label="Back">‹</button><div id="avatarWrap"><div class="avatar">G</div></div><div class="person"><h1 id="personName">Loading chat…</h1><p id="personUsername">Connecting to Glo-Tube…</p></div><button class="iconbtn" id="refreshButton" type="button" title="Refresh messages">↻</button></div></header>
<section id="messages" class="messages" aria-live="polite"><div class="state">Connecting to Glo-Tube…</div></section>
<div class="composer-wrap"><div id="replying" class="replying"><div class="replying-text"><strong id="replyingName">Replying</strong><div id="replyingBody"></div></div><button id="cancelReply" type="button" aria-label="Cancel reply">×</button></div>
<form class="composer" id="messageForm"><input id="fileInput" type="file" class="hidden" accept="*/*"><button class="toolbtn" id="attachButton" type="button" aria-label="Attach a file" title="Attach file">＋</button><button class="toolbtn" id="recordButton" type="button" aria-label="Record voice message" title="Record voice message">🎙</button><input id="messageInput" type="text" maxlength="2000" autocomplete="off" placeholder="Write a message…"><button class="send" id="sendButton" type="submit" aria-label="Send message">➤</button></form><div id="statusline" class="statusline" role="status"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
'use strict';
let currentUser=null,otherUser=null,refreshTimer=null,replyTarget=null,recorder=null,recordedChunks=[],recordingStream=null,loading=false;
const $=id=>document.getElementById(id);
const CLOUD_NAME='dg9qaek0h';
const UPLOAD_PRESET='glotube_uploads';
const CHAT_COLUMNS='id,sender_id,receiver_id,message,created_at,is_read,message_type,attachment_url,attachment_name,attachment_type,reply_to';
function setStatus(message){$('statusline').textContent=message||''}
function showError(message){$('messages').innerHTML='<div class="state error">'+escapeHtml(message)+'</div>';setStatus('')}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function safeUrl(v){try{const u=new URL(String(v));return ['https:','http:','blob:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function displayName(p){return ((p?.first_name||'')+' '+(p?.last_name||'')).trim()||p?.username||'User'}
async function boot(){
  try{
    if(typeof supabaseClient==='undefined'||!supabaseClient?.auth){showError('Supabase did not initialize. Check that supabase.js defines a global supabaseClient and that its URL/key are correct.');return}
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw new Error('Could not check login: '+error.message);
    if(!data.session){location.replace('login.html');return}
    currentUser=data.session.user;
    const userId=new URLSearchParams(location.search).get('user');
    if(!userId||userId===currentUser.id){location.replace('messages.html');return}
    const {data:profile,error:profileError}=await supabaseClient.from('profiles').select('id,username,first_name,last_name,profile_photo').eq('id',userId).maybeSingle();
    if(profileError)throw new Error('Could not load recipient profile: '+profileError.message);
    if(!profile)throw new Error('This user was not found. Check the user ID in the chat URL and your profiles table.');
    otherUser=profile;renderHeader();
    await loadMessages();
    await markReceivedAsRead();
    refreshTimer=setInterval(async()=>{await loadMessages();await markReceivedAsRead()},7000);
  }catch(e){console.error('Glo-Tube chat startup:',e);showError(e.message||'Could not connect to Glo-Tube. Please refresh the page.')}
}
function renderHeader(){const name=displayName(otherUser);$('personName').textContent=name;$('personUsername').textContent=otherUser.username?'@'+otherUser.username:'Glo-Tube user';$('avatarWrap').innerHTML=otherUser.profile_photo?'<img class="avatar" src="'+escapeHtml(safeUrl(otherUser.profile_photo))+'" alt="">':'<div class="avatar">'+escapeHtml(name.charAt(0).toUpperCase())+'</div>'}
async function loadMessages(){if(!currentUser||!otherUser||loading)return;loading=true;try{
  let result=await supabaseClient.from('messages').select(CHAT_COLUMNS).or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+otherUser.id+'),and(sender_id.eq.'+otherUser.id+',receiver_id.eq.'+currentUser.id+')').order('created_at',{ascending:true});
  // Older schemas may not yet have attachment/reply columns; still display text messages and explain the migration.
  if(result.error&&/column .* does not exist|schema cache/i.test(result.error.message||'')){
    result=await supabaseClient.from('messages').select('id,sender_id,receiver_id,message,created_at,is_read').or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+otherUser.id+'),and(sender_id.eq.'+otherUser.id+',receiver_id.eq.'+currentUser.id+')').order('created_at',{ascending:true});
    if(!result.error)setStatus('Text chat is working. Run the SQL setup below to enable attachments and replies.');
  }
  if(result.error)throw new Error(result.error.message);
  renderMessages(result.data||[]);
 }catch(e){console.error('Chat load error:',e);if(!$('messages').children.length||$('messages').querySelector('.state'))showError('Unable to load messages: '+e.message);else setStatus('Could not refresh messages: '+e.message)}finally{loading=false}}
function renderMessages(rows){const box=$('messages');if(!rows.length){box.innerHTML='<div class="state">💬<br><br>No messages yet.<br>Say hello!</div>';return}
 const oldHeight=box.scrollHeight,nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
 const byId=new Map(rows.map(r=>[String(r.id),r]));
 box.innerHTML=rows.map(row=>{const mine=String(row.sender_id)===String(currentUser.id);const reply=row.reply_to?byId.get(String(row.reply_to)):null;let body='';
  const url=safeUrl(row.attachment_url||'');
  const rawType=String(row.attachment_type||'').toLowerCase();
  const fileName=String(row.attachment_name||'').toLowerCase();
  const urlPath=String(row.attachment_url||'').split('?')[0].toLowerCase();
  const ext=(fileName||urlPath).split('.').pop();
  const type=(row.message_type&&row.message_type!=='text')?row.message_type:(rawType.startsWith('image/')||['jpg','jpeg','png','gif','webp','heic','avif'].includes(ext)?'image':rawType.startsWith('video/')||['mp4','mov','m4v','webm','ogv'].includes(ext)?'video':rawType.startsWith('audio/')||['mp3','wav','m4a','aac','ogg','oga','opus','weba','3gp'].includes(ext)?'voice':row.attachment_url?'file':'text');
  if(reply){body+='<div class="reply-preview" data-jump="'+escapeHtml(reply.id)+'"><div class="reply-name">'+escapeHtml(String(reply.sender_id)===String(currentUser.id)?'You':displayName(otherUser))+'</div>'+escapeHtml((reply.message||reply.attachment_name||'Attachment').slice(0,140))+'</div>'}
  if(type==='image'||(row.attachment_type||'').startsWith('image/'))body+='<a class="attachment" href="'+escapeHtml(url)+'" target="_blank" rel="noopener"><img src="'+escapeHtml(url)+'" alt="Image attachment" loading="lazy"></a>';
  else if(type==='video'||(row.attachment_type||'').startsWith('video/'))body+='<video class="attachment" controls playsinline preload="metadata" src="'+escapeHtml(url)+'"></video>';
  else if(type==='voice'||(row.attachment_type||'').startsWith('audio/'))body+='<audio class="attachment" controls preload="metadata" src="'+escapeHtml(url)+'"></audio>';
  else if(type==='file'&&row.attachment_url)body+='<a class="file-link" href="'+escapeHtml(url)+'" target="_blank" rel="noopener" download="'+escapeHtml(row.attachment_name||'download')+'">📎 <span>'+escapeHtml(row.attachment_name||'Download file')+'</span></a>';
  if(row.message)body+='<div class="message-text">'+escapeHtml(row.message)+'</div>';
  if(!body)body='<div class="message-text">Message attachment</div>';
  return '<div class="bubble-row '+(mine?'mine':'')+'" data-message-id="'+escapeHtml(row.id)+'"><div class="bubble">'+body+'<div class="meta">'+formatTime(row.created_at)+(mine?(row.is_read?' · Read':' · Sent'):'')+'</div><div class="bubble-actions"><button type="button" data-reply="'+escapeHtml(row.id)+'">↩ Reply</button></div></div></div>';
 }).join('');
 if(nearBottom||oldHeight===0)box.scrollTop=box.scrollHeight;
}
function formatTime(date){return new Date(date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
async function markReceivedAsRead(){if(!currentUser||!otherUser)return;try{const {error}=await supabaseClient.from('messages').update({is_read:true}).eq('sender_id',otherUser.id).eq('receiver_id',currentUser.id).eq('is_read',false);if(error)console.warn('Could not mark messages read:',error.message)}catch(e){console.warn(e)}}
function setReply(row){replyTarget=row;$('replyingName').textContent=String(row.sender_id)===String(currentUser.id)?'Replying to your message':('Replying to '+displayName(otherUser));$('replyingBody').textContent=(row.message||row.attachment_name||'Attachment').slice(0,180);$('replying').classList.add('show');$('messageInput').focus()}
$('messages').addEventListener('click',e=>{const b=e.target.closest('[data-reply]');if(b){const row=document.querySelector('[data-message-id="'+CSS.escape(b.dataset.reply)+'"]');if(!row)return;const text=row.querySelector('.message-text')?.textContent||row.querySelector('.file-link span')?.textContent||'Attachment';setReply({id:b.dataset.reply,sender_id:row.classList.contains('mine')?currentUser.id:otherUser.id,message:text});return}const jump=e.target.closest('[data-jump]');if(jump){document.querySelector('[data-message-id="'+CSS.escape(jump.dataset.jump)+'"]')?.scrollIntoView({behavior:'smooth',block:'center'})}});
// Swipe a message to the right to reply.
let touchStart=null;$('messages').addEventListener('touchstart',e=>{const row=e.target.closest('[data-message-id]');if(row)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,id:row.dataset.messageId,row}}, {passive:true});$('messages').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(dx>65&&Math.abs(dy)<50){const r=touchStart.row;setReply({id:touchStart.id,sender_id:r.classList.contains('mine')?currentUser.id:otherUser.id,message:r.querySelector('.message-text')?.textContent||r.querySelector('.file-link span')?.textContent||'Attachment'})}touchStart=null},{passive:true});
$('cancelReply').addEventListener('click',()=>{replyTarget=null;$('replying').classList.remove('show')});
async function uploadToCloudinary(file,kind='auto'){if(!CLOUD_NAME||!UPLOAD_PRESET)throw new Error('Upload settings are missing.');const data=new FormData();data.append('file',file);data.append('upload_preset',UPLOAD_PRESET);data.append('resource_type','auto');const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/auto/upload',{method:'POST',body:data});let json={};try{json=await res.json()}catch{}if(!res.ok)throw new Error(json.error?.message||'Upload failed. Check your Cloudinary unsigned preset and allowed file formats.');if(!json.secure_url)throw new Error('Cloudinary uploaded no usable file URL.');const name=file.name||'Voice message';const ext=name.toLowerCase().split('.').pop();let type=(file.type||'').toLowerCase();if(!type||type==='application/octet-stream'){if(['jpg','jpeg','png','gif','webp','heic','avif'].includes(ext))type='image/'+(ext==='jpg'?'jpeg':ext);else if(['mp4','mov','m4v','webm','ogv','3gp'].includes(ext))type='video/'+ext;else if(['mp3','wav','m4a','aac','ogg','oga','opus','weba'].includes(ext))type='audio/'+ext;}return {url:json.secure_url,name,type,resourceType:json.resource_type||'auto'}}
async function sendMessage({text='',file=null,voice=false}={}){if(!otherUser||!currentUser)return;if(!text.trim()&&!file)return;const button=$('sendButton');button.disabled=true;setStatus(file?'Uploading attachment…':'Sending…');try{let uploaded=null;if(file)uploaded=await uploadToCloudinary(file,'auto');const type=voice?'voice':!uploaded?'text':uploaded.type.startsWith('image/')?'image':uploaded.type.startsWith('video/')?'video':uploaded.type.startsWith('audio/')?'voice':'file';const row={sender_id:currentUser.id,receiver_id:otherUser.id,message:text.trim(),is_read:false};
 // Optional columns require the SQL migration below. If it hasn't been applied, don't silently pretend attachment/reply metadata was saved.
 if(uploaded){row.message_type=type;row.attachment_url=uploaded.url;row.attachment_name=uploaded.name;row.attachment_type=uploaded.type}if(replyTarget)row.reply_to=replyTarget.id;
 let result=await supabaseClient.from('messages').insert(row);
 if(result.error&&/column .* does not exist|schema cache/i.test(result.error.message||'')){if(uploaded)throw new Error('The file uploaded, but your messages table needs the SQL migration before attachments can be sent.');if(replyTarget)throw new Error('Run the SQL migration to enable replies. '+result.error.message);delete row.message_type;delete row.attachment_url;delete row.attachment_name;delete row.attachment_type;delete row.reply_to;result=await supabaseClient.from('messages').insert(row)}
 if(result.error)throw new Error(result.error.message);$('messageInput').value='';replyTarget=null;$('replying').classList.remove('show');setStatus('');await loadMessages();$('messages').scrollTop=$('messages').scrollHeight;
 }catch(e){console.error('Send failed:',e);setStatus('');alert('Could not send message:\n'+e.message)}finally{button.disabled=false}}
$('messageForm').addEventListener('submit',e=>{e.preventDefault();sendMessage({text:$('messageInput').value})});
$('attachButton').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(file){if(file.size>100*1024*1024){alert('Please choose a file smaller than 100 MB.');e.target.value='';return}await sendMessage({file});e.target.value=''}});
$('recordButton').addEventListener('click',async()=>{const btn=$('recordButton');if(recorder&&recorder.state==='recording'){recorder.stop();btn.classList.remove('recording');btn.textContent='🎙';btn.title='Record voice message';setStatus('Finishing voice message…');return}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Voice recording is not supported by this browser. Open the site over HTTPS and try a recent browser.');recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];let mime='';for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4'])if(MediaRecorder.isTypeSupported(m)){mime=m;break}recorder=new MediaRecorder(recordingStream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};recorder.onerror=e=>{console.error(e);setStatus('Voice recording failed.')};recorder.onstop=async()=>{recordingStream?.getTracks().forEach(t=>t.stop());recordingStream=null;const mimeType=recorder.mimeType||(recordedChunks[0]&&recordedChunks[0].type)||'audio/webm';const blob=new Blob(recordedChunks,{type:mimeType});if(blob.size){const ext=mimeType.includes('mp4')?'m4a':mimeType.includes('ogg')?'ogg':'webm';try{await sendMessage({file:new File([blob],'voice-message.'+ext,{type:mimeType}),voice:true})}catch(err){console.error('Voice send failed:',err);alert('Voice message could not be sent: '+err.message)}}else setStatus('No audio was recorded.');};recorder.start();btn.classList.add('recording');btn.textContent='■';btn.title='Stop and send voice message';setStatus('Recording… tap ■ to stop and send');}catch(e){console.error(e);setStatus('');alert('Cannot record voice: '+e.message)}});
$('refreshButton').addEventListener('click',()=>loadMessages());$('backButton').addEventListener('click',()=>location.href='messages.html');window.addEventListener('beforeunload',()=>{if(refreshTimer)clearInterval(refreshTimer);recordingStream?.getTracks().forEach(t=>t.stop())});
boot();
</script></body></html>
