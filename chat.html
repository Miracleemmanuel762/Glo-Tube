<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat • Glo-Tube</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#111827;font-family:Arial,Helvetica,sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 12px}
.toprow{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border:0;border-radius:50%;background:#f1f5f9;font-size:25px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#2196f3;color:#fff;display:grid;place-items:center;font-weight:700}
.person{min-width:0;flex:1}.person h1{margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person p{margin:3px 0 0;color:#64748b;font-size:12px}
.messages{flex:1;padding:18px 14px 92px;overflow-y:auto;background:#f8fafc;min-height:calc(100vh - 130px)}
.day{text-align:center;font-size:11px;color:#94a3b8;margin:10px 0 18px}
.bubble-row{display:flex;margin:7px 0}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:78%;padding:10px 13px;border-radius:17px;background:#e2e8f0;color:#111827;font-size:14px;line-height:1.45;word-break:break-word}
.mine .bubble{background:#2196f3;color:#fff;border-bottom-right-radius:5px}
.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}
.meta{font-size:9px;opacity:.7;margin-top:4px;text-align:right}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);background:#fff;border-top:1px solid #e5e7eb;padding:10px;display:flex;gap:8px;z-index:20}
.composer input{flex:1;border:1px solid #dbe2ea;border-radius:22px;padding:12px 15px;outline:none;min-width:0}
.composer input:focus{border-color:#2196f3}
.send{width:48px;height:48px;border:0;border-radius:50%;background:#2196f3;color:#fff;font-size:19px;cursor:pointer}
.send:disabled{opacity:.55}
.state{text-align:center;padding:60px 20px;color:#64748b}
.error{color:#b91c1c}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="toprow">
    <button class="back" id="backButton" type="button">‹</button>
    <div id="avatarWrap"></div>
    <div class="person">
      <h1 id="personName">Loading...</h1>
      <p id="personUsername"></p>
    </div>
  </div>
</header>

<section id="messages" class="messages">
  <div class="state">Loading conversation...</div>
</section>
</main>

<form class="composer" id="messageForm">
  <input id="messageInput" type="text" maxlength="2000" autocomplete="off" placeholder="Write a message...">
  <button class="send" id="sendButton" type="submit">➤</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let currentUser=null;
let otherUser=null;
let refreshTimer=null;

const $=id=>document.getElementById(id);

async function boot(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error||!data.session){location.replace("login.html");return}
  currentUser=data.session.user;

  const params=new URLSearchParams(location.search);
  const userId=params.get("user");

  if(!userId||userId===currentUser.id){
    location.replace("messages.html");
    return;
  }

  const {data:profile,error:profileError}=await supabaseClient
    .from("profiles")
    .select("id,username,first_name,last_name,profile_photo")
    .eq("id",userId)
    .maybeSingle();

  if(profileError||!profile){
    showError("Creator/user could not be found.");
    return;
  }

  otherUser=profile;
  renderHeader();
  await loadMessages();
  await markReceivedAsRead();

  refreshTimer=setInterval(loadMessages,5000);
}

function renderHeader(){
  const name=(`${otherUser.first_name||""} ${otherUser.last_name||""}`).trim()||otherUser.username||"User";
  $("personName").textContent=name;
  $("personUsername").textContent=otherUser.username?"@"+otherUser.username:"";

  $("avatarWrap").innerHTML=otherUser.profile_photo
    ? `<img class="avatar" src="${escapeHtml(otherUser.profile_photo)}" alt="">`
    : `<div class="avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
}

async function loadMessages(){
  if(!currentUser||!otherUser)return;

  const {data,error}=await supabaseClient
    .from("messages")
    .select("id,sender_id,receiver_id,message,created_at,is_read")
    .or(
      "and(sender_id.eq."+currentUser.id+",receiver_id.eq."+otherUser.id+"),"+
      "and(sender_id.eq."+otherUser.id+",receiver_id.eq."+currentUser.id+")"
    )
    .order("created_at",{ascending:true});

  if(error){
    console.error("Chat load error:",error);
    showError("Unable to load messages. Check your Supabase table policies.");
    return;
  }

  renderMessages(data||[]);
}

function renderMessages(rows){
  const box=$("messages");

  if(!rows.length){
    box.innerHTML='<div class="state">💬<br><br>No messages yet.<br>Say hello!</div>';
    return;
  }

  box.innerHTML=rows.map(row=>{
    const mine=row.sender_id===currentUser.id;
    return `<div class="bubble-row ${mine?"mine":""}">
      <div class="bubble">
        ${escapeHtml(row.message)}
        <div class="meta">${formatTime(row.created_at)}${mine?(row.is_read?" · Read":" · Sent"):""}</div>
      </div>
    </div>`;
  }).join("");

  box.scrollTop=box.scrollHeight;
}

async function markReceivedAsRead(){
  const {error}=await supabaseClient
    .from("messages")
    .update({is_read:true})
    .eq("sender_id",otherUser.id)
    .eq("receiver_id",currentUser.id)
    .eq("is_read",false);

  if(error)console.warn("Could not mark messages read:",error.message);
}

$("messageForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const input=$("messageInput");
  const button=$("sendButton");
  const text=input.value.trim();

  if(!text||!otherUser)return;

  button.disabled=true;

  const {error}=await supabaseClient
    .from("messages")
    .insert({
      sender_id:currentUser.id,
      receiver_id:otherUser.id,
      message:text,
      is_read:false
    });

  button.disabled=false;

  if(error){
    console.error("Send message error:",error);
    alert("Unable to send message:\\n\\n"+error.message);
    return;
  }

  input.value="";
  await loadMessages();
});

$("backButton").addEventListener("click",()=>{
  location.href="messages.html";
});

function formatTime(date){
  return new Date(date).toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function showError(message){
  $("messages").innerHTML='<div class="state error">'+escapeHtml(message)+'</div>';
}

window.addEventListener("beforeunload",()=>{
  if(refreshTimer)clearInterval(refreshTimer);
});

boot();
</script>
</body>
</html>
